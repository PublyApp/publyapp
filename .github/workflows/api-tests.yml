# Lane #1947: split the API test suite (`just test-api`) across a 4-way job
# matrix. See the issue for why this lane exists: the single-runner `just
# test-api` step was 14m41 (96% of the job), and four independent runners
# provisioning their own Testcontainers Postgres can run in parallel.
#
# Shape: this file follows the #1017 aggregate-gate template (changes -> heavy
# job(s) -> gate) that front-e2e/front-ci/openapi-spec-drift/docs-archive/
# quality-gate/react-doctor already use, and is registered in GATE_WORKFLOWS in
# packages/scripts-ts/src/check-ci-gate-structure.ts like every other gate.
# The required check name is `api-tests-gate` (repo convention is
# `<workflow>-gate`, and the structure guard reserves `api-tests` — it must not
# appear inside any non-gate job's reported name).
name: api tests

on:
  pull_request:
  # Required so this required check can report for a merge-queue entry: a
  # required Actions check missing this event waits forever once the entry
  # reaches the queue (GitHub's documented behavior). The repository has no
  # merge-queue rule today, so this is dormant, but a required check that
  # cannot report under a supported GitHub feature is a latent version of
  # the missing-check deadlock #1017 exists to remove.
  merge_group:
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - 'packages/client-ts/**'
      - 'packages/shared-ts/**'
      - 'packages/lint-cs/**'
      - '.config/dotnet-tools.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'justfile'
      - 'PublyApp.slnx'
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a newer push makes an older run's
# result irrelevant, and on a private repo every superseded minute is billed.
concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap first job: the pull_request trigger above has no `paths:` filter (a
  # path-filtered trigger never starts for an unrelated PR, so a required
  # status check gated only by the trigger would hang forever — see #1017).
  # This job always runs and decides whether the expensive suite below should.
  changes:
    name: Determine changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Checked out from the BASE commit, not this pull request's own ref:
      # this pins the classifier a pull request is being evaluated against so
      # an accidental or careless edit (a rename, a bad rebase, editing the
      # wrong copy) cannot silently change the relevance decision. Same shape,
      # same reasoning as every other #1017 aggregate gate in this repo.
      - name: Checkout classifier from the base commit (not the PR's own copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            packages/scripts-ts/src/ci-changed-paths.ts
          sparse-checkout-cone-mode: false
          path: base-ref

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Check whether api-tests paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Same path groups the `push.paths` trigger lists above — deliberately
        # not widened or narrowed. The classifier itself
        # (packages/scripts-ts/src/ci-changed-paths.ts) fails closed to relevant=true when
        # the changed-file list can't be verified complete (GitHub's
        # 3,000-file API ceiling) rather than trusting a truncated list — see
        # packages/scripts-ts/src/ci-changed-paths.test.ts.
        #
        # The base-pinned checkout above can legitimately be empty (see its
        # comment). If so, this fails closed to relevant=true on a path that
        # never invokes the classifier at all, kept structurally separate
        # from the classifier's own answer so a real relevant=false can never
        # be mistaken for "missing" and vice versa. See
        # packages/scripts-ts/src/ci-gate-bootstrap.test.ts, which executes this exact
        # inline script (parsed from workflow files) against both cases.
        run: |
          CLASSIFIER=base-ref/packages/scripts-ts/src/ci-changed-paths.ts

          if [ -f "$CLASSIFIER" ]; then
            node "$CLASSIFIER" '^(\.github/workflows/api-tests\.yml$|apps/api/|packages/client-ts/|packages/shared-ts/|packages/lint-cs/|\.config/dotnet-tools\.json$|Directory\.Build\.props$|Directory\.Build\.targets$|Directory\.Packages\.props$|global\.json$|justfile$|PublyApp\.slnx$)'
          else
            echo "::warning::[MISSING BASE CLASSIFIER] $CLASSIFIER does not exist at the base commit. This is expected exactly once: for the pull request that introduces this classifier, or a branch cut before it existed on the base branch. Relevance cannot be determined from a classifier that is not there, so this fails closed: treating the workflow as relevant and running everything. If this keeps happening on ordinary pull requests well after the classifier has been on the base branch, something is wrong — investigate, do not silence it."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  # The heavy job — sharded 4-way. Each shard provisions its own
  # Testcontainers Postgres (PostgresContainerFixture is per-process, and each
  # matrix shard runs on its own runner, so the four shards are independent).
  # Partitioning is by hash of the fully-qualified test class name (see
  # packages/scripts-ts/src/shard-api-tests.ts), NOT by discovery index: an
  # index-based split re-shuffles every test the moment one is added, which
  # makes a red shard unreproducible.
  suite:
    name: api-tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET (pinned for CI determinism)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.102'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # TestEnvironment.Bootstrap() requires .env.development (gitignored, so
      # absent in CI); materialize it from the committed template exactly as
      # openapi-spec-drift.yml does. APP_ROLE stays at the template default:
      # the recipe exports APP_ROLE="all" itself, and since #1019 an
      # explicitly-set process env var wins over the file anyway.
      - name: Materialize .env.development from template (CI has no gitignored env file)
        run: cp .env.example .env.development

      # Discover tests, partition by hash of class FQN, and run only this
      # shard's classes. The sharder emits a `FullyQualifiedName~FQN1|FullyQualifiedName~FQN2|...`
      # predicate that xUnit interprets as "run all test methods whose FQN
      # contains one of these class FQNs". Each shard provisions its own
      # Postgres via Testcontainers — no shared state.
      #
      # ROUND 2 FIXES (#1984):
      # 1. Filter operator is `FullyQualifiedName~`, not `ClassName=`:
      #    `ClassName=X` is xUnit's TRAIT-filter syntax, not a class filter,
      #    so a `ClassName=` predicate matches zero tests in this suite and
      #    the shard exits green with no work done. `FullyQualifiedName~X`
      #    is xUnit's substring match on the method's FQN — every method
      #    in class X has an FQN starting with X, so the predicate matches
      #    exactly X's tests.
      # 2. ROUND 5 FIX (#1984): the predicate is written to a `.runsettings`
      #    file and passed via `--settings`, NOT via `--filter "$FILTER"`.
      #    An earlier attempt passed the predicate on the command line with
      #    embedded double quotes (`FullyQualifiedName~"FQN"`). MSBuild
      #    parses `--filter` tokens split on `=`, and an embedded `"` lets
      #    it misread a `~` predicate fragment as a property name, producing
      #    `MSB4177: Invalid property. The name "FQN|..." contains an invalid
      #    character "."`. Writing the predicate to a runsettings file and
      #    using `--settings` sidesteps shell quoting entirely: the predicate
      #    reaches the driver verbatim, with no `"` characters at all
      #    (the sharder now emits the quote-free form `FullyQualifiedName~FQN`).
      # 3. The CI step parses the test summary line and ASSERTS that
      #    tests actually ran. An exit code of 0 from `dotnet test` does
      #    NOT prove tests ran — `dotnet test --filter ...` exits 0 with
      #    no test executions when the predicate matches nothing (and
      #    used to leave the matrix step green). The grep below catches
      #    that and fails the step, naming the shard.
      # 4. The shard writes a `shard-summary.json` artifact carrying
      #    `executed` (parsed from the summary line) and `partitionTotal`
      #    (from the partition manifest). The `gate` job downloads all
      #    four artifacts and asserts sum(executed) == partitionTotal —
      #    the property the partition must preserve.
      - name: Run API test suite (shard ${{ matrix.shard }}/4)
        env:
          APP_ROLE: all
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          set -euo pipefail

          cd apps/api
          dotnet restore Tests/PublyApp.Api.Tests.csproj

          # Discover all tests, partition, and capture both the predicate
          # and the partition manifest. The predicate is written to a
          # `.runsettings` file (runsettings-${{ matrix.shard }}.runsettings)
          # and passed to `dotnet test` via `--settings`, which avoids all
          # shell-quoting and MSBuild `=`-parse ambiguity. The manifest
          # carries the total-discovered figure for the gate's sum-vs-total
          # check.
          FILTER=$(dotnet test Tests/PublyApp.Api.Tests.csproj -c Test --no-restore --nologo --list-tests 2>/dev/null \
            | node "${{ github.workspace }}/packages/scripts-ts/src/shard-api-tests-cli.ts" ${{ matrix.shard }})

          # Re-run --list-tests to obtain the manifest (same blob, second
          # partition). `--list-tests` is idempotent on a built project.
          MANIFEST=$(dotnet test Tests/PublyApp.Api.Tests.csproj -c Test --no-restore --nologo --list-tests 2>/dev/null \
            | node "${{ github.workspace }}/packages/scripts-ts/src/shard-api-tests-cli.ts" --manifest)

          echo "Shard ${{ matrix.shard }} filter: $FILTER"

          # Write the predicate to a runsettings file. The `<TestCaseFilter>`
          # element is the documented `dotnet test` channel for a test-case
          # filter — it is read verbatim, with no shell quoting, no MSBuild
          # `=`-parse, and no embedded `"` characters (the sharder emits the
          # quote-free form `FullyQualifiedName~FQN1|FullyQualifiedName~FQN2|...`).
          # This is the round-5 fix for the MSB4177 quoting bug that broke
          # all four shards in rounds 1-4 of #1984. Using `printf` (not a
          # heredoc) because the `<RunSettings>` tag would confuse a YAML
          # parser into treating it as an implicit key.
          printf '<RunSettings>\n  <RunConfiguration>\n    <TestCaseFilter>%s</TestCaseFilter>\n  </RunConfiguration>\n</RunSettings>\n' "$FILTER" > "runsettings-${{ matrix.shard }}.runsettings"

          echo "Wrote runsettings file:"
          cat "runsettings-${{ matrix.shard }}.runsettings"

          # Run with the predicate from the runsettings file via --settings.
          # This is the round-5 fix: no `--filter "$FILTER"` on the command
          # line, so no embedded double quotes reach MSBuild's argument parser.
          dotnet test Tests/PublyApp.Api.Tests.csproj -c Test --no-restore --nologo \
            --settings "runsettings-${{ matrix.shard }}.runsettings" \
            --verbosity normal --logger "console;verbosity=normal" \
            2>&1 | tee shard-${{ matrix.shard }}-run.log

          # ASSERTS that real tests ran (round 2 fix #2). A clean exit
          # from `dotnet test` does not prove work was done; the
          # predicate could have matched nothing. Both conditions below
          # are needed:
          #   - the summary line shows Passed + Skipped + Failed > 0
          #     (counted from `Passed: N, ... Total: M` on the final
          #     summary line);
          #   - the output does NOT contain `No test matches the given
          #     testcase filter`, which is the marker for a zero-match
          #     predicate.
          SUMMARY_LINE=$(grep -E '^[[:space:]]*Passed![[:space:]]' shard-${{ matrix.shard }}-run.log | tail -n1 || true)

          if [ -z "$SUMMARY_LINE" ]; then
            echo "::error::[SHARD ${{ matrix.shard }}/4] No 'Passed!' summary line in the test output. The shard ran zero tests — the predicate matched nothing or `dotnet test` failed before producing a summary. Filter was: $FILTER"
            exit 1
          fi

          if grep -qE 'No test matches the given testcase filter' shard-${{ matrix.shard }}-run.log; then
            echo "::error::[SHARD ${{ matrix.shard }}/4] 'No test matches the given testcase filter' was printed. The filter matched zero tests — the predicate is wrong. Filter was: $FILTER"
            exit 1
          fi

          # Parse 'Total: N' from the summary line. `grep -oE 'Total:[[:space:]]+[0-9]+'`
          # extracts the value; the test below enforces Total > 0.
          TOTAL=$(echo "$SUMMARY_LINE" | grep -oE 'Total:[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | tail -n1)

          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "::error::[SHARD ${{ matrix.shard }}/4] Summary line present but 'Total:' was zero or missing. The shard ran zero tests. Summary line: $SUMMARY_LINE"
            exit 1
          fi

          echo "Shard ${{ matrix.shard }} executed $TOTAL tests."

          # Per-shard summary artifact for the gate's sum-vs-total
          # assertion (round 2 fix #3). The gate job downloads all four
          # artifacts and asserts sum(executed) == partitionTotalTestCount.
          cd "${{ github.workspace }}"
          mkdir -p api-shard-summaries
          jq -n \
            --argjson shard ${{ matrix.shard }} \
            --argjson executed "$TOTAL" \
            --argjson manifest "$MANIFEST" \
            '{
              shard: $shard,
              executed: $executed,
              partitionTotal: $manifest.totalTestCount,
              partitionClassCount: $manifest.totalClassCount
            }' > api-shard-summaries/shard-${{ matrix.shard }}.json
          echo "Wrote shard summary: $(cat api-shard-summaries/shard-${{ matrix.shard }}.json)"

      # Always-on shard-summary upload: the gate's sum-vs-total check needs
      # every shard's summary to be downloadable even on success. Failure
      # log capture stays conditional below.
      - name: Upload shard summary (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-shard-summary-${{ github.run_id }}-${{ matrix.shard }}
          path: api-shard-summaries/shard-${{ matrix.shard }}.json
          retention-days: 5

      # Failure-only log capture: get failing specs off the ephemeral runner.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-results-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            apps/api/Tests/TestResults/
            apps/api/.artifacts/logs/
            api-shard-summaries/
          if-no-files-found: ignore
          retention-days: 5

  # Required status check: this is the one context that should be required
  # on the branch ruleset instead of relying on the trigger. It always
  # reports (if: always()), passes when upstream jobs succeeded or were
  # skipped (irrelevant PR), and fails on any real failure or cancellation
  # rather than treating either as "not applicable".
  gate:
    # BLOCKER fix (rounds 5/6 of #1017): the event-conditional allowlist name.
    # A push-triggered run reports under the non-required
    # "api-tests-push-check" context so it can never collide with the required
    # "api-tests-gate" context on the same commit. Only pull_request and
    # merge_group resolve to the required name.
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'api-tests-gate' || 'api-tests-push-check' }}
    if: always()
    needs: [changes, suite]
    runs-on: ubuntu-latest
    steps:
      # Reads the `needs` context directly (via toJSON) instead of a
      # hand-written per-job map: a job added to `needs` above without also
      # being added to a hand-maintained Bash list would silently never be
      # checked (round-2 review). `needs` is populated by Actions from this
      # job's own `needs:` keyword, so there is no second list to omit an
      # entry from.
      - name: Check required jobs
        id: check-required-jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # Fail closed on anything outside the exact documented shape: a
        # nonempty JSON object whose every entry's result is exactly
        # "success" or "skipped". An empty object/array, a missing `.result`,
        # or an unrecognized result value must never silently pass. Skipped
        # work is correlated with the classifier's own verdict: skipped is
        # only acceptable when needs.changes.outputs.relevant is EXACTLY the
        # string "false" (GitHub can omit a job output entirely — including
        # because it may contain a secret — so absent/empty/malformed fails
        # closed). See packages/scripts-ts/src/ci-gate-aggregation.test.ts,
        # which extracts and executes this exact script body against a
        # matrix of representative payloads.
        run: |
          if [ "$(echo "$NEEDS_JSON" | jq -r 'type')" != "object" ]; then
            echo "::error::NEEDS_JSON is not a JSON object — examining nothing must never pass."
            exit 1
          fi

          if [ "$(echo "$NEEDS_JSON" | jq 'length')" -eq 0 ]; then
            echo "::error::NEEDS_JSON has no entries — examining zero jobs must never pass."
            exit 1
          fi

          echo "Required jobs and their results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          changes_result="$(echo "$NEEDS_JSON" | jq -r '.changes.result // "MISSING"')"

          if [ "$changes_result" != "success" ]; then
            echo "::error::needs.changes.result must be exactly \"success\" (found: \"$changes_result\"). Nothing downstream can be trusted if the changed-paths classifier itself did not run to completion."
            exit 1
          fi

          relevant="$(echo "$NEEDS_JSON" | jq -r '.changes.outputs.relevant // "MISSING"')"

          if [ "$relevant" != "true" ] && [ "$relevant" != "false" ]; then
            echo "::error::needs.changes.outputs.relevant must be exactly the string \"true\" or \"false\" (found: \"$relevant\"). GitHub can omit a job output entirely — including because it may contain a secret — so an absent, empty, or otherwise malformed relevance signal must never be treated as license to accept skipped verification work."
            exit 1
          fi

          if [ "$relevant" = "true" ]; then
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select(.result != "success")] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::The changes classifier reported this change as relevant, so every required job must have actually run and succeeded (skipped is not acceptable) — but one or more did not (see results above)."
              exit 1
            fi
          else
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select((.result == "success" or .result == "skipped") | not)] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::One or more required jobs did not report success or skipped (failure, cancelled, or an unrecognized result value)."
              exit 1
            fi
          fi

          echo "All required jobs passed, or were correctly skipped for a verified-irrelevant change."

      # BLOCKER fix (round 5): `continue-on-error: true` added to the step
      # above would make its reported CONCLUSION "success" even after it
      # printed `::error::` and exited 1 — masking a correctly-detected
      # aggregation failure. GitHub computes a step's `outcome` BEFORE
      # continue-on-error is applied (only `conclusion` is rewritten
      # afterward), so reading `steps.check-required-jobs.outcome` here is
      # not fooled by continue-on-error on that step.
      - name: Verify the required-jobs check truly succeeded (continue-on-error cannot mask this)
        if: always()
        run: |
          outcome="${{ steps.check-required-jobs.outcome }}"

          if [ "$outcome" != "success" ]; then
            echo "::error::steps.check-required-jobs.outcome was \"$outcome\", not \"success\". continue-on-error can rewrite a step's CONCLUSION but not its OUTCOME, so a masked required-jobs check failure is still caught here."
            exit 1
          fi

      # ROUND 2 FIX (#1984) — ASSERT that the four shards preserved the
      # partition. The `check-required-jobs` step above verifies that
      # each matrix shard's parent job reported `success`, but a parent
      # job can be `success` while every child silently ran zero tests
      # (this is the round-1 defect: `dotnet test --filter X` exits 0
      # when X matches nothing, the matrix job reports `success`, and
      # four green shards certified a partition that did no work).
      #
      # Each shard writes an `api-shard-summary-<run-id>-<shard>.json`
      # artifact with `executed` (parsed from the `Passed!` summary line)
      # and `partitionTotal` (from the partition manifest). This step
      # downloads all four summaries, sums `executed`, and asserts the
      # sum equals `partitionTotal` — the property the partition MUST
      # preserve, and the property a round-1 silent zero-run shard could
      # never satisfy.
      #
      # Why here and not in the `suite` job: the matrix's parent job
      # cannot aggregate matrix subtotal data (GitHub exposes only
      # `result`, no per-shard outputs). The aggregation step needs
      # cross-shard state, so it must run in a downstream job. Putting
      # it in `gate` keeps the topology honest (one logical check,
      # one job boundary) and avoids introducing a fourth job whose
      # existence the structural guard would need to be told about.
      - name: Download shard summaries
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: api-shard-summary-${{ github.run_id }}-*
          path: shard-summaries
          merge-multiple: false

      - name: Verify shard-sum equals partition total
        if: needs.changes.outputs.relevant == 'true'
        run: |
          # 1. Exactly four summaries, one per shard (1..4). A
          #    missing or duplicated summary means a shard was lost
          #    or doubled — either is a partition violation.
          expected_count=4
          actual_count=$(find shard-summaries -maxdepth 1 -type f -name 'shard-*.json' | wc -l)

          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "::error::Expected exactly $expected_count shard summary files under shard-summaries/, found $actual_count. Each of the 4 matrix shards must have produced one summary."
            find shard-summaries -maxdepth 1 -type f -name 'shard-*.json' -printf '  %p\n' || true
            exit 1
          fi

          # 2. Every summary has the expected shape: a `shard` number
          #    in [1,4], a non-negative `executed`, and a non-negative
          #    `partitionTotal`. A summary missing any of these is a
          #    sign the shard step produced malformed output — fail
          #    loud rather than trust a 0.
          for f in shard-summaries/shard-*.json; do
            shape_ok=$(jq -e '
              (.shard | type == "number" and . >= 1 and . <= 4) and
              (.executed | type == "number" and . >= 0) and
              (.partitionTotal | type == "number" and . >= 0)
            ' "$f" >/dev/null 2>&1 && echo yes || echo no)
            if [ "$shape_ok" != "yes" ]; then
              echo "::error::Summary $f does not have the expected shape {shard: number 1..4, executed: number >=0, partitionTotal: number >=0}. Contents: $(cat "$f")"
              exit 1
            fi
          done

          # 3. Every shard reports the same partitionTotal — the
          #    partition is deterministic (sha1 of class FQN modulo 4),
          #    so all four shards see the same discovered total. A
          #    mismatch would mean a shard was built against a
          #    different --list-tests blob (e.g., the test project
          #    rebuilt between shards with a different test count).
          distinct_totals=$(jq -r '.partitionTotal' shard-summaries/shard-*.json | sort -u | wc -l)
          if [ "$distinct_totals" -ne 1 ]; then
            echo "::error::The four shards reported different partition totals (the partition is supposed to be deterministic). The test project likely rebuilt with a different test count between shards."
            for f in shard-summaries/shard-*.json; do
              echo "  $(jq -c '.' "$f")"
            done
            exit 1
          fi

          # 4. THE ASSERTION: sum(executed) == partitionTotal. This is
          #    the property the partition MUST preserve and the
          #    property a round-1 silent zero-run shard could never
          #    satisfy. Every shard reports its own `executed` and its
          #    own `partitionTotal`; they agree on the partitionTotal
          #    (check 3), so we can use any of them as the RHS.
          total_executed=$(jq -s '[.[].executed] | add' shard-summaries/shard-*.json)
          partition_total=$(jq -r '.partitionTotal' shard-summaries/shard-*.json | head -n1)
          total_partition_class=$(jq -s '[.[].partitionClassCount] | add' shard-summaries/shard-*.json | head -n1)

          echo "Shard execution summary:"
          for f in shard-summaries/shard-*.json; do
            echo "  $(jq -c '.' "$f")"
          done
          echo "Sum of executed across 4 shards: $total_executed"
          echo "Partition total (discovered):    $partition_total"
          echo "Partition class count:           $total_partition_class"

          if [ "$total_executed" -ne "$partition_total" ]; then
            echo "::error::Shard-sum does not equal partition-total. The partition failed to preserve the discovered test count — one or more shards ran fewer tests than they were assigned, or the predicate matched nothing. Expected $partition_total, got $total_executed."
            exit 1
          fi

          if [ "$total_executed" -eq 0 ]; then
            echo "::error::The four shards together executed zero tests. The partition is broken end-to-end — every shard's predicate matched nothing."
            exit 1
          fi

          echo "Shard-sum equals partition-total: $total_executed == $partition_total."
