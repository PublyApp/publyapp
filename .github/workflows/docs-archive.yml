name: docs archive checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-archive-records.mjs'
      - 'scripts/check-archive-records.test.mjs'
      - '.github/workflows/docs-archive.yml'
  push:
    paths:
      - 'docs/**'
      - 'scripts/check-archive-records.mjs'
      - 'scripts/check-archive-records.test.mjs'
      - '.github/workflows/docs-archive.yml'

permissions:
  contents: read

jobs:
  docs-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Run archive guard fixture tests
        run: node --test ./scripts/check-archive-records.test.mjs

      - name: Check archive records
        run: node scripts/check-archive-records.mjs
