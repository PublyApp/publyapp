name: docs archive checks

on:
  pull_request:
  push:
    paths:
      - 'docs/**'
      - 'scripts/check-archive-records.mjs'
      - 'scripts/check-archive-records.test.mjs'
      - '.github/workflows/docs-archive.yml'

permissions:
  contents: read

jobs:
  # Cheap first job: the pull_request trigger above has no `paths:` filter (a
  # path-filtered trigger never starts for an unrelated PR, so a required
  # status check gated only by the trigger would hang forever — see #1017).
  # This job always runs and decides whether the expensive job below should.
  changes:
    name: Determine changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # A pull_request run checks out the PR's own merge commit by default,
      # which means the PR's own copy of the classifier decides whether the
      # PR gets tested — a PR could edit this script to always report
      # relevant=false (round-2 review). Force the base commit instead, so
      # the classifier that runs is not something this pull request controls.
      # Not a complete trust boundary (the calling workflow is itself
      # merge-commit-controlled) — see #1017 follow-up for the honest
      # framing — but it closes the script-only bypass.
      - name: Checkout classifier from the base commit (not the PR's own copy)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/ci-changed-paths.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check whether docs-archive paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Same path groups the old `pull_request.paths` filter listed —
        # deliberately not widened or narrowed. The classifier itself
        # (scripts/ci-changed-paths.mjs) fails closed to relevant=true when
        # the changed-file list can't be verified complete (GitHub's
        # 3,000-file API ceiling) rather than trusting a truncated list — see
        # scripts/ci-changed-paths.test.mjs.
        run: |
          node scripts/ci-changed-paths.mjs '^(docs/|scripts/check-archive-records\.mjs$|scripts/check-archive-records\.test\.mjs$|\.github/workflows/docs-archive\.yml$)'

  docs-archive:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Run archive guard fixture tests
        run: node --test ./scripts/check-archive-records.test.mjs

      - name: Check archive records
        run: node scripts/check-archive-records.mjs

  # Required status check: this is the one context that should be required
  # on the branch ruleset instead of relying on the trigger. It always
  # reports (if: always()), passes when upstream jobs succeeded or were
  # skipped (irrelevant PR), and fails on any real failure or cancellation
  # rather than treating either as "not applicable".
  gate:
    name: docs-archive-gate
    if: always()
    needs: [changes, docs-archive]
    runs-on: ubuntu-latest
    steps:
      # Reads the `needs` context directly (via toJSON) instead of a
      # hand-written per-job map: a job added to `needs` above without also
      # being added to a hand-maintained Bash list would silently never be
      # checked (round-2 review). `needs` is populated by Actions from this
      # job's own `needs:` keyword, so there is no second list to omit an
      # entry from.
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Required jobs and their results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')"

          if [ "$bad_count" -gt 0 ]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi

          echo "All required jobs passed or were skipped."
