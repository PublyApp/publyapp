name: OpenAPI Spec Drift

# Guards determinism of the build-generated apps/api/openapi.json and the
# Kiota-generated packages/client-ts. A clean build + client regeneration must
# leave the tree byte-identical; a dirty tree means the committed artifacts
# drifted and need regenerating + committing. See issue #683.

on:
  pull_request:
  push:
    branches: [develop]
    paths:
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "apps/api/**"
      - "packages/client-ts/**"
      - "justfile"
      - "global.json"
      - ".gitattributes"
      - ".config/dotnet-tools.json"
      - ".github/workflows/openapi-spec-drift.yml"

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a newer push makes an older run's
# result irrelevant, and on a private repo every superseded minute is billed.
concurrency:
  group: openapi-spec-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap first job: the pull_request trigger above has no `paths:` filter (a
  # path-filtered trigger never starts for an unrelated PR, so a required
  # status check gated only by the trigger would hang forever — see #1017).
  # This job always runs and decides whether the expensive job below should.
  changes:
    name: Determine changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Checked out from the BASE commit, not this pull request's own ref:
      # this pins the classifier a pull request is being evaluated against so
      # an accidental or careless edit (a rename, a bad rebase, editing the
      # wrong copy) cannot silently change the relevance decision.
      #
      # This is NOT a defense against a pull request that deliberately tries
      # to bypass its own gates. The `changes` job's YAML — including the
      # invocation step below, and this comment — is itself read from the
      # pull request's merge commit, the same as every other job in this
      # workflow. A pull request can already rewrite that step's `run:` to
      # print `relevant=true`/`false` unconditionally, or delete this
      # checkout, or anything else, exactly as freely as it could edit a
      # separate script file. Pinning the classifier's SOURCE closes the
      # narrower "an edit to ci-changed-paths.mjs itself is silently
      # honored" gap; it does not and cannot close the wider gap that the
      # workflow calling it is merge-commit-controlled. That wider gap is
      # tracked in #1022, with the honest framing: these gates defend against
      # mistakes, not a malicious author of a branch in this repository — the
      # real controls there are who can push branches and GitHub's
      # fork-approval requirement.
      #
      # This checkout can legitimately produce nothing: the pull request that
      # introduces this classifier (or a branch cut before it existed on the
      # base branch) has no such file at its base commit. The invocation step
      # below fails closed to relevant=true rather than crashing when that
      # happens.
      - name: Checkout classifier from the base commit (not the PR's own copy)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/ci-changed-paths.mjs
          sparse-checkout-cone-mode: false
          path: base-ref

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check whether openapi-spec-drift paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Same path groups the old `pull_request.paths` filter listed —
        # deliberately not widened or narrowed. The classifier itself
        # (scripts/ci-changed-paths.mjs) fails closed to relevant=true when
        # the changed-file list can't be verified complete (GitHub's
        # 3,000-file API ceiling) rather than trusting a truncated list — see
        # scripts/ci-changed-paths.test.mjs.
        #
        # The base-pinned checkout above can legitimately be empty (see its
        # comment). If so, this fails closed to relevant=true on a path that
        # never invokes the classifier at all, kept structurally separate
        # from the classifier's own answer so a real relevant=false can never
        # be mistaken for "missing" and vice versa. See
        # scripts/ci-gate-bootstrap.test.mjs, which executes this exact
        # inline script (parsed from this file) against both cases.
        run: |
          CLASSIFIER=base-ref/scripts/ci-changed-paths.mjs

          if [ -f "$CLASSIFIER" ]; then
            node "$CLASSIFIER" '^(Directory\.Build\.props$|Directory\.Build\.targets$|Directory\.Packages\.props$|apps/api/|packages/client-ts/|justfile$|global\.json$|\.gitattributes$|\.config/dotnet-tools\.json$|\.github/workflows/openapi-spec-drift\.yml$)'
          else
            echo "::warning::[MISSING BASE CLASSIFIER] $CLASSIFIER does not exist at the base commit. This is expected exactly once: for the pull request that introduces this classifier, or a branch cut before it existed on the base branch. Relevance cannot be determined from a classifier that is not there, so this fails closed: treating the workflow as relevant and running everything. If this keeps happening on ordinary pull requests well after the classifier has been on the base branch, something is wrong — investigate, do not silence it."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  spec-drift:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (pinned for CI determinism)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.102"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools (kiota, dotnet-ef)
        run: dotnet tool restore

      # Build-time OpenAPI generation boots the app (host env unset -> Production),
      # so AppEnvironment.Initialize() loads the repo-root .env.development for its
      # config values. That file is gitignored and absent in CI, so materialize it
      # from the committed .env.example template.
      #
      # Since #1019, DotNetEnv.LoadOptions.NoClobber() makes an already-set process env
      # var win over the file, so the just recipe's own `$APP_ROLE="api"` export already
      # resolves correctly on its own -- this sed is now belt-and-braces, not load-bearing.
      # It stays for defense in depth: .env.example ships APP_ROLE="all" (the local-dev
      # default that runs api+worker in one process), and if that file's APP_ROLE=all
      # ever DID win, doc-gen would compose the worker host, whose
      # WorkerMigrationStartupGate blocks on a live database (5-min retry loop -> failure)
      # that this DB-less job does not have. api-only doc-gen never touches the DB, so it
      # succeeds offline.
      - name: Materialize .env.development from template (CI has no gitignored env file)
        run: |
          cp .env.example .env.development
          sed -i 's/^APP_ROLE=.*/APP_ROLE="api"/' .env.development

      - name: Build API (regenerates openapi.json)
        run: just build-api-full

      - name: Fail if openapi.json drifted
        run: |
          if ! git diff --exit-code -- apps/api/openapi.json; then
            echo "::error::apps/api/openapi.json is not byte-identical to a clean build. Run 'just build-api' locally and commit the result."
            exit 1
          fi

      - name: Regenerate TypeScript client
        run: just generate-client

      - name: Fail if client drifted
        run: |
          git diff --exit-code -- packages/client-ts
          if [ -n "$(git status --porcelain -- packages/client-ts)" ]; then
            git status --short -- packages/client-ts
            echo "::error::packages/client-ts is not byte-identical to a clean 'just generate-client'. Regenerate and commit."
            exit 1
          fi

      - name: Run OpenAPI contract spec
        run: |
          cd apps/api && dotnet test Tests/PublyApp.Api.Tests.csproj -c Test             --filter "FullyQualifiedName~OpenApiContractSpec"

  # Required status check: this is the one context that should be required
  # on the branch ruleset instead of relying on the trigger. It always
  # reports (if: always()), passes when upstream jobs succeeded or were
  # skipped (irrelevant PR), and fails on any real failure or cancellation
  # rather than treating either as "not applicable".
  gate:
    name: openapi-spec-drift-gate
    if: always()
    needs: [changes, spec-drift]
    runs-on: ubuntu-latest
    steps:
      # Reads the `needs` context directly (via toJSON) instead of a
      # hand-written per-job map: a job added to `needs` above without also
      # being added to a hand-maintained Bash list would silently never be
      # checked (round-2 review). `needs` is populated by Actions from this
      # job's own `needs:` keyword, so there is no second list to omit an
      # entry from.
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Required jobs and their results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select(.result == "failure" or .result == "cancelled")] | length')"

          if [ "$bad_count" -gt 0 ]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi

          echo "All required jobs passed or were skipped."
