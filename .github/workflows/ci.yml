        id: install_workspace
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.api == 'true'
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Materialize .env.development
        id: materialize_env
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.api == 'true'
        continue-on-error: true
        run: |
          cp .env.example .env.development
          sed -i 's/^APP_ROLE=.*/APP_ROLE="api"/' .env.development
      - name: Restore .NET tools
        id: restore_tools
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.api == 'true'
        continue-on-error: true
        run: dotnet tool restore
      - name: Build API and OpenAPI document
        id: build_api
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.api == 'true'
        continue-on-error: true
        run: just build-api-full
      - name: Check OpenAPI drift
        id: openapi_drift
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.api == 'true'
        continue-on-error: true
        run: |
          git diff --exit-code -- apps/api/openapi.json
      - name: Regenerate TypeScript client
        id: generate_client
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.api == 'true'
        continue-on-error: true
