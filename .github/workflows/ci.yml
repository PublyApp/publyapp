        id: no_ignored_tracked
        if: always()
        continue-on-error: true
        run: node packages/scripts-ts/src/check-no-ignored-tracked.ts
      - name: Check no dockerignore shadow files
        id: no_dockerignore_shadow
        if: always()
        continue-on-error: true
        run: node packages/scripts-ts/src/check-dockerignore-shadow.ts
      - name: Test API path-filter coverage
        id: api-paths-tests
        if: always()
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/check-api-tests-path-coverage.test.ts
      - name: Verify API path-filter coverage
        id: api-paths
        if: always()
        continue-on-error: true
        run: node packages/scripts-ts/src/check-api-tests-path-coverage.ts
      - name: Collect ci-lane-result
        if: always()
        env:
          CI_JOB_KEY: guards
          CI_WORKFLOW_PATH: '.github/workflows/ci.yml'
