        continue-on-error: true
        run: node packages/scripts-ts/src/run-ci-contract-tests.ts
      - name: Check CI drift
        id: ci_drift
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: node packages/scripts-ts/src/check-ci-drift.ts
      - name: Check action versions
        id: action_versions
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: node packages/scripts-ts/src/check-actions-pinned.ts
      - name: Test project closure adapter
        id: project_closure
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm test:project-closure-adapter
      - name: CI lane not applicable (quality)
        id: quality-sentinel
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'false'
        run: echo 'quality verification is not applicable'
