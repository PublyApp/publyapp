          CI_LANE_SPECS: '{"e2e":["e2e-test.checkout","e2e-test.install_pnpm","e2e-test.setup_node","e2e-test.assert_pins","e2e-test.install_dependencies","e2e-test.login","e2e-test.rerun_guard","e2e-test.pull_stack","e2e-test.download_images","e2e-test.load_images","e2e-test.cache_playwright","e2e-test.up_stack","e2e-test.wait_health","e2e-test.playwright","e2e-test.report_upload","e2e-test.teardown","e2e-test.not-applicable"]}'
          CI_CLASSIFIER_OUTPUTS: '{"e2e":"${{ needs.classify.outputs.e2e == ''true'' && github.event_name == ''merge_group'' }}"}'
          CI_STEP_RESULTS: '{"e2e-test.checkout":{"outcome":"${{ steps.checkout.outcome }}"},"e2e-test.install_pnpm":{"outcome":"${{ steps.install-pnpm.outcome }}"},"e2e-test.setup_node":{"outcome":"${{ steps.setup-node.outcome }}"},"e2e-test.assert_pins":{"outcome":"${{ steps.assert-pins.outcome }}"},"e2e-test.install_dependencies":{"outcome":"${{ steps.install-dependencies.outcome }}"},"e2e-test.login":{"outcome":"${{ steps.login.outcome }}"},"e2e-test.rerun_guard":{"outcome":"${{ steps.rerun-guard.outcome }}"},"e2e-test.pull_stack":{"outcome":"${{ steps.pull-stack.outcome }}"},"e2e-test.download_images":{"outcome":"${{ steps.download-images.outcome }}"},"e2e-test.load_images":{"outcome":"${{ steps.load-images.outcome }}"},"e2e-test.cache_playwright":{"outcome":"${{ steps.cache-playwright.outcome }}"},"e2e-test.up_stack":{"outcome":"${{ steps.up-stack.outcome }}"},"e2e-test.wait_health":{"outcome":"${{ steps.wait-health.outcome }}"},"e2e-test.playwright":{"outcome":"${{ steps.playwright.outcome }}"},"e2e-test.report_upload":{"outcome":"${{ steps.report-upload.outcome }}"},"e2e-test.teardown":{"outcome":"${{ steps.teardown.outcome }}"},"e2e-test.not-applicable":{"outcome":"${{ steps.sentinel.outcome }}"}}'
        run: node packages/scripts-ts/src/ci-lane-result.ts
      - name: Upload ci-lane-result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lane-result-${{ github.run_id }}-${{ github.run_attempt }}-e2e-test-${{ matrix.shard }}
          path: ci-results/e2e-test-${{ matrix.shard }}.json
          if-no-files-found: error

  e2e-cleanup:
    name: Clean up e2e images
    needs: [classify, e2e-build, e2e-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cleanup e2e images
        id: cleanup
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_IMAGE_TAG: ${{ needs.e2e-build.outputs.tag }}
          FORK_RUN: ${{ needs.e2e-build.outputs.fork }}
        run: node packages/scripts-ts/src/ci-e2e-cleanup.ts
      - name: CI lane not applicable
        id: sentinel
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'false'
        run: echo 'E2E cleanup is not applicable'
      - name: Collect ci-lane-result
        if: always()
        env:
          CI_JOB_KEY: e2e-cleanup
          CI_WORKFLOW_PATH: .github/workflows/ci.yml
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_WORKFLOW_EVENT: ${{ github.event_name }}
          CI_LANE_SPECS: '{"e2e":["e2e-cleanup.checkout","e2e-cleanup.cleanup","e2e-cleanup.not-applicable"]}'
          CI_CLASSIFIER_OUTPUTS: '{"e2e":"${{ needs.classify.outputs.e2e }}"}'
          CI_STEP_RESULTS: '{"e2e-cleanup.checkout":{"outcome":"${{ steps.checkout.outcome }}"},"e2e-cleanup.cleanup":{"outcome":"${{ steps.cleanup.outcome }}"},"e2e-cleanup.not-applicable":{"outcome":"${{ steps.sentinel.outcome }}"}}'
        run: node packages/scripts-ts/src/ci-lane-result.ts
      - name: Upload ci-lane-result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lane-result-${{ github.run_id }}-${{ github.run_attempt }}-e2e-cleanup
          path: ci-results/e2e-cleanup.json
          if-no-files-found: error

  gate:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'ci-final-gate' || 'ci-push-check' }}
    needs:
      [
        classify,
        quality-js,
        quality-dotnet,
        guards,
        docs-react,
        front-build,
        front-quality,
        audit-development,
        audit-production,
        api,
        front-vitest,
        e2e-build,
        e2e-smoke,
        e2e-test,
        e2e-cleanup,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download exact upstream result artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-lane-result-${{ github.run_id }}-*
          path: ci-results
      - name: Read live PR snapshot
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_PR_PHASE: read
          CI_LIVE_PR_RECORD_PATH: ci-live-pr-record.json
          CI_WORKFLOW_PATH: .github/workflows/ci.yml
          CI_RESULT_DIR: ci-results
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node packages/scripts-ts/src/ci-pr-snapshot.ts
      - name: Verify linked issue relationship
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_LIVE_PR_RECORD_PATH: ci-live-pr-record.json
        run: |
          PR_NUMBER="$(jq -r '.pr_number' "$CI_LIVE_PR_RECORD_PATH")"
          PR_AUTHOR="$(jq -r '.pr.author_login' "$CI_LIVE_PR_RECORD_PATH")"
          PR_BODY="$(jq -r '.pr.body' "$CI_LIVE_PR_RECORD_PATH")"
          export PR_NUMBER PR_AUTHOR PR_BODY GH_REPO
          PR_NUMBER="$PR_NUMBER" PR_AUTHOR="$PR_AUTHOR" PR_BODY="$PR_BODY" GH_REPO="$GH_REPO" bash <<'LINKED_ISSUE_SCRIPT'
          set -euo pipefail

          if [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "app/dependabot" ]; then
            echo "dependabot PR — linked-issue requirement waived by policy #1240"
            exit 0
          fi

          if [ -z "${PR_BODY//[[:space:]]/}" ]; then
            echo "::error::PR body is empty — it must link an issue (e.g. \"Closes #123\" or \"Part of #123\")."
            exit 1
          fi

          relationships=$(printf '%s' "$PR_BODY" \
            | grep -ioE '^[[:space:]]*(-[[:space:]]*)?(close[sd]?|fix(e[sd])?|resolve[sd]?|part[[:space:]]+of|refs?|references?)[[:space:]:]+#[0-9]+' \
            | sort -u)

          if [ -z "$relationships" ]; then
            echo "::error::This PR has no explicit issue relationship on its own line. Add \"Closes #123\" for complete work or \"Part of #123\"/\"Refs #123\" for a partial slice."
            exit 1
          fi

          closing_issue_numbers=''
          closing_issues_verified=false
          verify_closing_issue() {
            if [ "$closing_issues_verified" = "false" ]; then
              repo_owner="${GH_REPO%%/*}"
              repo_name="${GH_REPO#*/}"
              if ! closing_issue_numbers=$(gh api graphql \
                -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){closingIssuesReferences(first:100){nodes{number}}}}}' \
                -F owner="$repo_owner" \
                -F name="$repo_name" \
                -F number="$PR_NUMBER" \
                --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' \
                2>/dev/null
              ); then
                echo "  could not verify GitHub closingIssuesReferences for PR #$PR_NUMBER — rejecting the closing declaration."
                return 1
              fi
              closing_issues_verified=true
            fi

            if ! printf '%s\n' "$closing_issue_numbers" | grep -Fxq "$1"; then
              echo "  #$1 is not present in GitHub closingIssuesReferences — rejecting the closing declaration."
              return 1
            fi
          }

          invalid_relationship=false
          linked_issue=false
          while IFS= read -r relationship; do
            n=$(printf '%s' "$relationship" | grep -oE '[0-9]+$')
            is_closing=false
            if printf '%s' "$relationship" | grep -qiE '^[[:space:]]*(-[[:space:]]*)?(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]+'; then
              is_closing=true
            fi

            if [ "$n" = "$PR_NUMBER" ]; then
              echo "  #$n references itself — a pull request cannot satisfy its own issue-link requirement."
              invalid_relationship=true
              continue
            fi

            if ! is_pr=$(gh api "repos/${GH_REPO}/issues/${n}" --jq '.pull_request != null' 2>/dev/null); then
              echo "  #$n could not be verified as an existing issue — rejecting the declaration."
              invalid_relationship=true
              continue
            fi
            if [ "$is_pr" = "true" ]; then
              if [ "$is_closing" = "true" ]; then
                echo "  #$n is a pull request, not an issue — rejecting the closing declaration (#2003)."
                invalid_relationship=true
              else
                echo "  #$n is a non-closing pull-request reference — it does not satisfy the issue requirement."
              fi
              continue
            fi

            if [ "$is_closing" = "true" ] && ! verify_closing_issue "$n"; then
              invalid_relationship=true
              continue
            fi

            if state=$(gh issue view "$n" --json state --jq '.state' 2>/dev/null); then
              echo "✓ PR links issue #$n (state: $state)."
              linked_issue=true
              continue
            fi
            echo "  #$n is not an existing issue — rejecting the declaration."
            invalid_relationship=true
          done <<< "$relationships"

          if [ "$invalid_relationship" = "true" ]; then
            echo "::error::A closing relationship to a PR, a self-reference, an unverifiable number, or a failed closing-reference lookup invalidates the declaration."
            exit 1
          fi

          if [ "$linked_issue" = "true" ]; then
            exit 0
          fi

          echo "::error::The relationship keyword(s) reference no existing issue. Link a real issue with \"Closes #N\" or \"Part of #N\"."
          exit 1
          LINKED_ISSUE_SCRIPT
      - name: Run central structural self-check
        run: node packages/scripts-ts/src/check-ci-gate-structure.ts
      - name: Aggregate upstream artifacts
        env:
          CI_CLASSIFIER_RESULT: ${{ needs.classify.result }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_WORKFLOW_PATH: .github/workflows/ci.yml
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_ARTIFACT_DIRECTORY: ci-results
          CI_CLASSIFIER_OUTPUTS: '{"quality":"${{ needs.classify.outputs.quality }}","front":"${{ needs.classify.outputs.front }}","api":"${{ needs.classify.outputs.api }}","e2e":"${{ needs.classify.outputs.e2e }}","docs":"${{ needs.classify.outputs.docs }}","react":"${{ needs.classify.outputs.react }}"}'
          CI_CENTRAL_RESULTS: '{"quality-js":"${{ needs.quality-js.result }}","quality-dotnet":"${{ needs.quality-dotnet.result }}","guards":"${{ needs.guards.result }}","docs-react":"${{ needs.docs-react.result }}","front-build":"${{ needs.front-build.result }}","front-quality":"${{ needs.front-quality.result }}","audit-development":"${{ needs.audit-development.result }}","audit-production":"${{ needs.audit-production.result }}","api":"${{ needs.api.result }}","front-vitest":"${{ needs.front-vitest.result }}","e2e-build":"${{ needs.e2e-build.result }}","e2e-smoke":"${{ needs.e2e-smoke.result }}","e2e-test":"${{ needs.e2e-test.result }}","e2e-cleanup":"${{ needs.e2e-cleanup.result }}"}'
        run: node packages/scripts-ts/src/check-ci-gate-aggregation.ts ci-results
      - name: Write live PR snapshot
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_PR_PHASE: snapshot
          CI_LIVE_PR_RECORD_PATH: ci-live-pr-record.json
          CI_RESULT_DIR: ci-results
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node packages/scripts-ts/src/ci-pr-snapshot.ts
      - name: Upload live PR snapshot
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-pr-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/ci-pr-snapshot.json
          if-no-files-found: error
