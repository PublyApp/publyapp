        id: wait-health
        if: always() && github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true' && needs.e2e-build.result == 'success' && steps.up-stack.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          timeout 180 bash -lc '
            services="front api request-counter traefik toxiproxy postgres"
            for attempt in $(seq 1 90); do
              all_running=true
              for service in $services; do
                container_id="$(docker compose -f apps/front/docker-compose.test.yml ps -q "$service")"
                [ -n "$container_id" ] || { all_running=false; break; }
