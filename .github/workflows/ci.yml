  e2e-build:
    name: Build e2e images
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
      root: ${{ steps.image-root.outputs.root }}
      fork: ${{ steps.image-fork.outputs.fork }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve image tag
        id: image-tag
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true'
        run: echo "tag=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Resolve image root
        id: image-root
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true'
        run: echo "root=ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/publyapp-e2e" >> "$GITHUB_OUTPUT"
      - name: Resolve fork state
        id: image-fork
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true'
        run: echo "fork=${{ github.event.pull_request.head.repo.fork || 'false' }}" >> "$GITHUB_OUTPUT"
      - name: Setup Docker Buildx
        id: setup-buildx
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Setup GitHub Actions runtime
        id: setup-runtime
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Login to GHCR
        id: login
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true' && steps.image-fork.outputs.fork != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push e2e images
        id: images
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true'
        continue-on-error: true
        env:
          COMPOSE_BAKE: 'true'
          E2E_IMAGE_NS: ${{ steps.image-root.outputs.root }}
          E2E_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail
          compose_files=(-f apps/front/docker-compose.test.yml)
          if [ "${{ steps.image-fork.outputs.fork }}" = "true" ]; then
            compose_files+=(-f apps/front/docker-compose.fork-overlay.yml)
          fi
          docker compose "${compose_files[@]}" build
          if [ "${{ steps.image-fork.outputs.fork }}" != "true" ]; then
            docker compose -f apps/front/docker-compose.test.yml push migrate api request-counter front
          else
            mkdir -p /tmp/e2e-images
            for service in migrate api request-counter front; do
              docker save "${E2E_IMAGE_NS}-${service}:${E2E_IMAGE_TAG}" | gzip > "/tmp/e2e-images/${service}.tar.gz"
            done
          fi
      - name: Verify built front image
        id: runtime-guard
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true' && steps.images.outcome == 'success'
        continue-on-error: true
        env:
          E2E_IMAGE_NS: ${{ steps.image-root.outputs.root }}
          E2E_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: node apps/front/scripts/run-guarded.mts apps/front/scripts/ci/check-front-runtime-image.mts --image "${E2E_IMAGE_NS}-front:${E2E_IMAGE_TAG}"
      - name: Upload fork e2e images
        id: upload-images
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.e2e == 'true' && steps.image-fork.outputs.fork == 'true' && steps.images.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stack-images-${{ steps.image-tag.outputs.tag }}
          path: /tmp/e2e-images/*.tar.gz
          retention-days: 1
          compression-level: 0
