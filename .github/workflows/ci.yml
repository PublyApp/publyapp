name: central ci

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:
  push:
    branches: [develop]

concurrency:
  group: central-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CI_RESULT_DIR: ci-results

jobs:
  classify:
    name: CI classifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      quality: ${{ steps.classifier.outputs.quality }}
      front: ${{ steps.classifier.outputs.front }}
      api: ${{ steps.classifier.outputs.api }}
      e2e: ${{ steps.classifier.outputs.e2e }}
      docs: ${{ steps.classifier.outputs.docs }}
      react: ${{ steps.classifier.outputs.react }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout classifier from the base commit
        id: base_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base-ref
          sparse-checkout: packages/scripts-ts/src/ci-changed-paths.ts
          sparse-checkout-cone-mode: false
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Classify changed paths once
        id: classifier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          classifier='base-ref/packages/scripts-ts/src/ci-changed-paths.ts'
          if [ -f "$classifier" ] && grep -Fq 'CI_CLASSIFIER_ABI_VERSION = 2' "$classifier"; then
            node "$classifier" --lanes
          else
            echo '::warning::base classifier ABI is unavailable; failing closed to every lane'
            for lane in quality front api e2e docs react; do
              echo "${lane}=true" >> "$GITHUB_OUTPUT"
            done
          fi
      - name: Collect ci-lane-result
        if: always()
        env:
          CI_JOB_KEY: classify
          CI_WORKFLOW_PATH: .github/workflows/ci.yml
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          CI_WORKFLOW_EVENT: ${{ github.event_name }}
          CI_LANE_SPECS: '{"classifier":["classify.checkout","classify.base_checkout","classify.setup_node","classify.run"]}'
          CI_LANE_MODES: '{"classifier":"relevant"}'
          CI_STEP_RESULTS: '{"classify.checkout":{"outcome":"${{ steps.checkout.outcome }}"},"classify.base_checkout":{"outcome":"${{ steps.base_checkout.outcome }}"},"classify.setup_node":{"outcome":"${{ steps.setup_node.outcome }}"},"classify.run":{"outcome":"${{ steps.classifier.outcome }}"}}'
        run: node packages/scripts-ts/src/ci-lane-result.ts
      - name: Upload ci-lane-result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lane-result-${{ github.run_id }}-${{ github.run_attempt }}-classify
          path: ci-results/classify.json
          if-no-files-found: error

  quality-js:
    name: CI quality (JS)
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        id: install_pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup .NET
        id: setup_dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.102'
      - name: Setup just
        id: setup_just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install workspace dependencies
        id: install_workspace
        if: always()
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run trusted first-party postinstall
        id: trusted_postinstall
        if: always()
        continue-on-error: true
        run: pnpm --filter @org/shared-ts run postinstall
      - name: Install Git hooks
        id: prepare_hooks
        if: always()
        continue-on-error: true
        run: pnpm run prepare
      - name: Materialize .env.development
        id: materialize_env
        if: always()
        continue-on-error: true
        run: |
          cp .env.example .env.development
          sed -i 's/^APP_ROLE=.*/APP_ROLE="api"/' .env.development
      - name: Assert exact pins
        id: assert_pins
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: node apps/front/scripts/run-guarded.mts apps/front/scripts/guards/assert-pinned.mts
      - name: Check formatting
        id: format
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm format
      - name: Lint repository
        id: lint
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm lint
      - name: Check complexity bounds
        id: complexity
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: node packages/scripts-ts/src/check-cyclomatic-bound.ts
      - name: Test lint plugin
        id: lint_ts_test
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter @org/lint-ts test
      - name: Typecheck lint plugin
        id: lint_ts_typecheck
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter @org/lint-ts typecheck
      - name: Typecheck generated client
        id: client_typecheck
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter @org/client-ts typecheck
      - name: Check unused exports and dependencies
        id: knip
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm exec knip
      - name: Typecheck shared TypeScript
        id: shared_typecheck
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter @org/shared-ts typecheck
      - name: Test shared TypeScript
        id: shared_test
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter @org/shared-ts test
      - name: CI lane not applicable (quality)
        id: quality-sentinel
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'false'
        run: echo 'quality verification is not applicable'
      - name: Collect ci-lane-result
        if: always()
        env:
          CI_JOB_KEY: quality-js
          CI_WORKFLOW_PATH: '.github/workflows/ci.yml'
          CI_WORKFLOW_REF: '${{ github.workflow_ref }}'
          CI_WORKFLOW_EVENT: '${{ github.event_name }}'
          CI_LANE_SPECS: '{"setup":["quality-js.checkout","quality-js.install_pnpm","quality-js.setup_node","quality-js.setup_dotnet","quality-js.setup_just","quality-js.install_workspace","quality-js.trusted_postinstall","quality-js.prepare_hooks","quality-js.materialize_env"],"quality":["quality-js.assert_pins","quality-js.format","quality-js.lint","quality-js.complexity","quality-js.lint_ts_test","quality-js.lint_ts_typecheck","quality-js.client_typecheck","quality-js.knip","quality-js.shared_typecheck","quality-js.shared_test","quality-js.quality.not-applicable"]}'
          CI_CLASSIFIER_OUTPUTS: '{"quality":"${{ needs.classify.outputs.quality }}"}'
          CI_LANE_MODES: '{"setup":"relevant"}'
          CI_STEP_RESULTS: '{"quality-js.checkout":{"outcome":"${{ steps.checkout.outcome }}"},"quality-js.install_pnpm":{"outcome":"${{ steps.install_pnpm.outcome }}"},"quality-js.setup_node":{"outcome":"${{ steps.setup_node.outcome }}"},"quality-js.setup_dotnet":{"outcome":"${{ steps.setup_dotnet.outcome }}"},"quality-js.setup_just":{"outcome":"${{ steps.setup_just.outcome }}"},"quality-js.install_workspace":{"outcome":"${{ steps.install_workspace.outcome }}"},"quality-js.trusted_postinstall":{"outcome":"${{ steps.trusted_postinstall.outcome }}"},"quality-js.prepare_hooks":{"outcome":"${{ steps.prepare_hooks.outcome }}"},"quality-js.materialize_env":{"outcome":"${{ steps.materialize_env.outcome }}"},"quality-js.assert_pins":{"outcome":"${{ steps.assert_pins.outcome }}"},"quality-js.format":{"outcome":"${{ steps.format.outcome }}"},"quality-js.lint":{"outcome":"${{ steps.lint.outcome }}"},"quality-js.complexity":{"outcome":"${{ steps.complexity.outcome }}"},"quality-js.lint_ts_test":{"outcome":"${{ steps.lint_ts_test.outcome }}"},"quality-js.lint_ts_typecheck":{"outcome":"${{ steps.lint_ts_typecheck.outcome }}"},"quality-js.client_typecheck":{"outcome":"${{ steps.client_typecheck.outcome }}"},"quality-js.knip":{"outcome":"${{ steps.knip.outcome }}"},"quality-js.shared_typecheck":{"outcome":"${{ steps.shared_typecheck.outcome }}"},"quality-js.shared_test":{"outcome":"${{ steps.shared_test.outcome }}"},"quality-js.quality.not-applicable":{"outcome":"${{ steps.quality-sentinel.outcome }}"}}'
        run: node packages/scripts-ts/src/ci-lane-result.ts
      - name: Upload ci-lane-result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lane-result-${{ github.run_id }}-${{ github.run_attempt }}-quality-js
          path: ci-results/quality-js.json
          if-no-files-found: error

  quality-dotnet:
    name: CI quality (.NET)
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        id: install_pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup .NET
        id: setup_dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.102'
      - name: Setup just
        id: setup_just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install workspace dependencies
        id: install_workspace
        if: always()
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run trusted first-party postinstall
        id: trusted_postinstall
        if: always()
        continue-on-error: true
        run: pnpm --filter @org/shared-ts run postinstall
      - name: Install Git hooks
        id: prepare_hooks
        if: always()
        continue-on-error: true
        run: pnpm run prepare
      - name: Materialize .env.development
        id: materialize_env
        if: always()
        continue-on-error: true
        run: |
          cp .env.example .env.development
          sed -i 's/^APP_ROLE=.*/APP_ROLE="api"/' .env.development
      - name: Restore .NET solution
        id: dotnet_restore
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        env:
          APP_ROLE: api
          TRUSTED_PROXY_CIDRS: '127.0.0.1/32'
          SOCIAL_ACCOUNTS_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        run: dotnet restore PublyApp.slnx
      - name: Build .NET solution
        id: dotnet_build
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        env:
          APP_ROLE: api
          TRUSTED_PROXY_CIDRS: '127.0.0.1/32'
          SOCIAL_ACCOUNTS_MASTER_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        run: dotnet build PublyApp.slnx --no-restore
      - name: Audit .NET packages
        id: nuget_audit
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        env:
          APP_ROLE: api
          TRUSTED_PROXY_CIDRS: '127.0.0.1/32'
        run: node packages/scripts-ts/src/nuget-audit.ts
      - name: Test .NET audit fixtures
        id: nuget_fixtures
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/nuget-audit.test.ts
      - name: Run analyzer tests
        id: analyzers
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm exec just test-analyzers
      - name: CI lane not applicable (quality)
        id: quality-sentinel
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'false'
        run: echo 'quality verification is not applicable'
      - name: Collect ci-lane-result
        if: always()
        env:
          CI_JOB_KEY: quality-dotnet
          CI_WORKFLOW_PATH: '.github/workflows/ci.yml'
          CI_WORKFLOW_REF: '${{ github.workflow_ref }}'
          CI_WORKFLOW_EVENT: '${{ github.event_name }}'
          CI_LANE_SPECS: '{"setup":["quality-dotnet.checkout","quality-dotnet.install_pnpm","quality-dotnet.setup_node","quality-dotnet.setup_dotnet","quality-dotnet.setup_just","quality-dotnet.install_workspace","quality-dotnet.trusted_postinstall","quality-dotnet.prepare_hooks","quality-dotnet.materialize_env"],"quality":["quality-dotnet.dotnet_restore","quality-dotnet.dotnet_build","quality-dotnet.nuget_audit","quality-dotnet.nuget_fixtures","quality-dotnet.analyzers","quality-dotnet.quality.not-applicable"]}'
          CI_CLASSIFIER_OUTPUTS: '{"quality":"${{ needs.classify.outputs.quality }}"}'
          CI_LANE_MODES: '{"setup":"relevant"}'
          CI_STEP_RESULTS: '{"quality-dotnet.checkout":{"outcome":"${{ steps.checkout.outcome }}"},"quality-dotnet.install_pnpm":{"outcome":"${{ steps.install_pnpm.outcome }}"},"quality-dotnet.setup_node":{"outcome":"${{ steps.setup_node.outcome }}"},"quality-dotnet.setup_dotnet":{"outcome":"${{ steps.setup_dotnet.outcome }}"},"quality-dotnet.setup_just":{"outcome":"${{ steps.setup_just.outcome }}"},"quality-dotnet.install_workspace":{"outcome":"${{ steps.install_workspace.outcome }}"},"quality-dotnet.trusted_postinstall":{"outcome":"${{ steps.trusted_postinstall.outcome }}"},"quality-dotnet.prepare_hooks":{"outcome":"${{ steps.prepare_hooks.outcome }}"},"quality-dotnet.materialize_env":{"outcome":"${{ steps.materialize_env.outcome }}"},"quality-dotnet.dotnet_restore":{"outcome":"${{ steps.dotnet_restore.outcome }}"},"quality-dotnet.dotnet_build":{"outcome":"${{ steps.dotnet_build.outcome }}"},"quality-dotnet.nuget_audit":{"outcome":"${{ steps.nuget_audit.outcome }}"},"quality-dotnet.nuget_fixtures":{"outcome":"${{ steps.nuget_fixtures.outcome }}"},"quality-dotnet.analyzers":{"outcome":"${{ steps.analyzers.outcome }}"},"quality-dotnet.quality.not-applicable":{"outcome":"${{ steps.quality-sentinel.outcome }}"}}'
        run: node packages/scripts-ts/src/ci-lane-result.ts
      - name: Upload ci-lane-result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-lane-result-${{ github.run_id }}-${{ github.run_attempt }}-quality-dotnet
          path: ci-results/quality-dotnet.json
          if-no-files-found: error

  guards:
    name: CI guard battery
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        id: install_pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup .NET
        id: setup_dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.102'
      - name: Setup just
        id: setup_just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install workspace dependencies
        id: install_workspace
        if: always()
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run trusted first-party postinstall
        id: trusted_postinstall
        if: always()
        continue-on-error: true
        run: pnpm --filter @org/shared-ts run postinstall
      - name: Install Git hooks
        id: prepare_hooks
        if: always()
        continue-on-error: true
        run: pnpm run prepare
      - name: Materialize .env.development
        id: materialize_env
        if: always()
        continue-on-error: true
        run: |
          cp .env.example .env.development
          sed -i 's/^APP_ROLE=.*/APP_ROLE="api"/' .env.development
      - name: Test CI guard suite
        id: ci_guard_suite
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter scripts-ts exec vitest run src/check-actions-pinned.test.ts src/check-cyclomatic-bound.test.ts src/ci-referenced-paths.test.ts src/codeowners-contract.test.ts src/dependency-health-pin-location.test.ts
      - name: Test CI guard subprocess fixtures
        id: ci_guard_spawners
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter scripts-ts exec vitest run src/check-no-floating-promises.test.ts src/ci-changed-paths.test.ts src/ci-e2e-rerun-guard.test.ts src/gen-reason-ref.test.ts src/require-linked-issue.test.ts
      - name: Test CI drift contracts
        id: ci_drift_tests
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/check-ci-drift.test.ts src/artifact-version-compat.test.ts
      - name: Test npm audit runner
        id: npm_audit_runner
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/npm-audit-runner.test.ts
      - name: Test production audit threshold
        id: production_audit_test
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/prod-audit-bites.test.ts
      - name: Check formatter scope
        id: formatter_scope
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/check-formatter-scope.test.ts
      - name: Test front lint guard
        id: front_lint_test
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/lint-front.test.ts
      - name: Test CI contracts
        id: ci_contract_tests
