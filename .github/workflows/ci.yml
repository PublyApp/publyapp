        continue-on-error: true
        run: node packages/scripts-ts/src/audit-docs-prune.ts --check
      - name: CI lane not applicable (docs)
        id: docs-sentinel
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.docs == 'false'
        run: echo 'docs verification is not applicable'
      - name: Resolve React Doctor base
        id: resolve_react_base
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.react == 'true'
        continue-on-error: true
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$CI_EVENT_NAME" in
            pull_request) diff_base="$CI_PR_BASE_SHA" ;;
            merge_group) diff_base="$CI_MERGE_GROUP_BASE_SHA" ;;
            push)
              if [ -n "$CI_PUSH_BEFORE" ] && [ "$CI_PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                diff_base="$CI_PUSH_BEFORE"
              else
                diff_base='HEAD~1'
              fi
              ;;
            *) echo "unsupported event $CI_EVENT_NAME" >&2; exit 1 ;;
          esac
          git rev-parse --verify "$diff_base^{commit}" >/dev/null
          printf 'base=%s\n' "$diff_base" >> "$GITHUB_OUTPUT"
