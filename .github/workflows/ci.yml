        id: install_workspace
        if: always()
        continue-on-error: true
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run trusted first-party postinstall
        id: trusted_postinstall
        if: always()
        continue-on-error: true
        run: pnpm --filter @org/shared-ts run postinstall
      - name: Install Git hooks
        id: prepare_hooks
        if: always()
        continue-on-error: true
        run: pnpm run prepare
      - name: Materialize .env.development
        id: materialize_env
        if: always()
        continue-on-error: true
        run: |
          cp .env.example .env.development
          sed -i 's/^APP_ROLE=.*/APP_ROLE="api"/' .env.development
      - name: Check action SHA bindings
        id: action_pins
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --filter scripts-ts exec vitest run src/check-actions-pins.test.ts
          node ./packages/scripts-ts/src/check-actions-pins.ts
      - name: Check deploy environment documentation
        id: deploy_env_docs
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'true'
        continue-on-error: true
        run: |
          pnpm --filter scripts-ts exec vitest run src/check-deploy-env-docs.test.ts
          node ./packages/scripts-ts/src/check-deploy-env-docs.ts
      - name: CI lane not applicable (quality)
        id: quality-sentinel
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.quality == 'false'
        run: echo 'quality verification is not applicable'
      - name: Test doc-links guard
        id: docs_links_test
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.docs == 'true'
        continue-on-error: true
        run: pnpm --filter scripts-ts exec vitest run src/check-doc-links.test.ts
      - name: Test docs prune guard
        id: docs_prune_test
        if: always() && needs.classify.result == 'success' && needs.classify.outputs.docs == 'true'
        continue-on-error: true
