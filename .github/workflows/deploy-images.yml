name: publish deploy images

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'apps/front/**'
      - 'packages/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/deploy-images.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-deploy-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable release tag
        id: release
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push API runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ghcr.io/radandevist/publyapp/api:${{ steps.release.outputs.tag }}

      - name: Build and push API migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          platforms: linux/amd64
          tags: ghcr.io/radandevist/publyapp/migrate:${{ steps.release.outputs.tag }}

      - name: Build and push Front image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/front/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/radandevist/publyapp/front:${{ steps.release.outputs.tag }}
