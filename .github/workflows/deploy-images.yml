name: publish deploy images

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/api/**'
      - 'apps/front/**'
      - 'packages/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/deploy-images.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-deploy-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable release tag
        id: release
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The repository moved from radandevist to the PublyApp organization
      # (2026-08-25, #1362). Derive the GHCR root from the current owner
      # instead of a hardcoded namespace, and force lowercase: GHCR/docker
      # reject uppercase in image paths, and "PublyApp" is not all-lowercase.
      - name: Resolve lowercase image namespace
        id: ns
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "root=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/publyapp" >> "$GITHUB_OUTPUT"

      - name: Build and push API runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ns.outputs.root }}/api:${{ steps.release.outputs.tag }}

      - name: Build and push API migrate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ns.outputs.root }}/migrate:${{ steps.release.outputs.tag }}

      - name: Build and push Front image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/front/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ns.outputs.root }}/front:${{ steps.release.outputs.tag }}
