name: Require Linked Issue

# Every PR must close a GitHub issue. This gate fails when a PR has no
# linked closing issue, so the policy no longer depends on anyone remembering
# to add "Closes #N" by hand. Re-runs on body edits so adding the keyword clears it.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

# Supersede in-flight runs for the same PR. This job is cheap, but it retriggers
# on every body edit, so a burst of edits would otherwise queue a run each and
# only the last one's verdict is meaningful.
concurrency:
  group: require-linked-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the PR closes an existing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout step runs, so gh has no local repo to infer; GH_REPO
          # gives `gh issue view` its repository context.
          GH_REPO: ${{ github.repository }}
          # GitHub's own closingIssuesReferences is computed lazily and is not
          # reliably visible to the Actions GITHUB_TOKEN, so parse the PR body
          # for closing keywords directly and confirm each referenced issue
          # actually exists. Deterministic, no indexing lag, no token quirk.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          # Policy #1240 (owner decision 2026-08-22): bot-generated dependency
          # bumps (dependabot[bot]) are merged on green CI alone and need not
          # close a tracking issue. This waiver is keyed on the PR AUTHOR login
          # and matches EXACTLY that one login — not github.actor, not a label —
          # so another author cannot widen it, and no other bot login is covered
          # by accident. The guard test (packages/scripts-ts/src/require-linked-issue.test.ts)
          # fails if this equality is widened (e.g. endsWith('[bot]')) or removed.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "dependabot PR — linked-issue requirement waived by policy #1240"
            exit 0
          fi

          if [ -z "${PR_BODY//[[:space:]]/}" ]; then
            echo "::error::PR body is empty — it must link an issue with a closing keyword (e.g. \"Closes #123\")."
            exit 1
          fi

          # Match: (close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) [#]<number>
          numbers=$(printf '%s' "$PR_BODY" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -u)

          if [ -z "$numbers" ]; then
            echo "::error::This PR has no closing keyword. Add one referencing an existing issue (e.g. \"Closes #123\", \"Resolves #123\", or \"Fixes #123\"). Create the issue first if one does not exist."
            exit 1
          fi

          for n in $numbers; do
            # #2003: `gh issue view <PR-number>` SUCCEEDS and returns the PR's
            # state, so a body like "Closes #<any-PR>" satisfies this gate
            # falsely. The captain's note is explicit: excluding only "the
            # current PR's number" is NOT enough — `Closes #<another-PR>` passes
            # just as falsely. We must exclude EVERY pull request, not just
            # this one. The discriminator is the `pull_request` key on the
            # issue-object endpoint: present (non-null) for PRs, absent for
            # real issues. We fetch that single field and skip any number whose
            # object is a PR. A real issue has no `pull_request` key, so its
            # value is `null` and jq -e returns exit code 0 with `false`; a PR
            # has a non-null `pull_request` object, so jq -e returns exit code
            # 1 (the assertion `== false` fails) and we skip it.
            is_pr=$(gh api "repos/${GH_REPO}/issues/${n}" --jq '.pull_request != null' 2>/dev/null) || is_pr="true"
            if [ "$is_pr" = "true" ]; then
              echo "  #$n is a pull request, not an issue — skipping (#2003)."
              continue
            fi

            if state=$(gh issue view "$n" --json state --jq '.state' 2>/dev/null); then
              echo "✓ PR closes issue #$n (state: $state)."
              exit 0
            fi
            echo "  #$n is not an existing issue — skipping."
          done

          echo "::error::The closing keyword(s) reference no existing issue: $(echo "$numbers" | tr '\n' ' '). Link a real issue with \"Closes #N\"."
          exit 1

  # #1569: prohibit unverifiable exhaustiveness claims in PR bodies ("N
  # dimensions validated", "validation is exhaustive") — a claim the next
  # reviewer cannot check is worse than a silence. Reads the REAL body via
  # the GitHub API (never a fixture, never an author-supplied echo) and runs
  # the guard script against it. Runs on every PR and re-runs on body edits.
  pr-body-exhaustiveness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the PR body makes no unverifiable exhaustiveness claims (#1569)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read the REAL PR body via the GitHub API (never a fixture): the
          # guard cannot judge a body that was handed to it by the author.
          PR_BODY="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.body // ""')"
          export PR_BODY
          node packages/scripts-ts/src/check-pr-body-exhaustiveness.ts
