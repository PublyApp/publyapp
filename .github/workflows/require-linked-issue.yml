name: Require Linked Issue

# Every PR must link a real GitHub issue. A complete PR may use a closing
# keyword; an honest partial slice may use "Part of", "Refs", or "References"
# without prematurely closing its parent. Re-runs on body edits.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read

# Supersede in-flight runs for the same PR. This job is cheap, but it retriggers
# on every body edit, so a burst of edits would otherwise queue a run each and
# only the last one's verdict is meaningful.
concurrency:
  group: require-linked-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the PR links an existing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout step runs, so gh has no local repo to infer; GH_REPO
          # gives `gh issue view` its repository context.
          GH_REPO: ${{ github.repository }}
          # Parse explicit relationship keywords so honest partial slices can
          # link their parent without falsely closing it. Confirm closing
          # targets are issues rather than pull requests (#2003).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Policy #1240 (owner decision 2026-08-22): bot-generated dependency
          # bumps (dependabot[bot]) are merged on green CI alone and need not
          # close a tracking issue. This waiver is keyed on the PR AUTHOR login
          # and matches EXACTLY that one login — not github.actor, not a label —
          # so another author cannot widen it, and no other bot login is covered
          # by accident. The guard test (packages/scripts-ts/src/require-linked-issue.test.ts)
          # fails if this equality is widened (e.g. endsWith('[bot]')) or removed.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "dependabot PR — linked-issue requirement waived by policy #1240"
            exit 0
          fi

          if [ -z "${PR_BODY//[[:space:]]/}" ]; then
            echo "::error::PR body is empty — it must link an issue (e.g. \"Closes #123\" or \"Part of #123\")."
            exit 1
          fi

          # Match a closing or non-closing relationship declared at the start
          # of its own line (an optional Markdown list marker is allowed).
          # Anchoring avoids treating negated prose such as "does not close
          # #123" as a relationship. Arbitrary bare mentions do not satisfy it.
          relationships=$(printf '%s' "$PR_BODY" \
            | grep -ioE '^[[:space:]]*(-[[:space:]]*)?(close[sd]?|fix(e[sd])?|resolve[sd]?|part[[:space:]]+of|refs?|references?)[[:space:]:]+#[0-9]+' \
            | sort -u)

          if [ -z "$relationships" ]; then
            echo "::error::This PR has no explicit issue relationship on its own line. Add \"Closes #123\" for complete work or \"Part of #123\"/\"Refs #123\" for a partial slice."
            exit 1
          fi

          invalid_relationship=false
          linked_issue=false
          while IFS= read -r relationship; do
            n=$(printf '%s' "$relationship" | grep -oE '[0-9]+$')
            is_closing=false
            if printf '%s' "$relationship" | grep -qiE '^[[:space:]]*(-[[:space:]]*)?(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]+'; then
              is_closing=true
            fi

            if [ "$n" = "$PR_NUMBER" ]; then
              echo "  #$n references itself — a pull request cannot satisfy its own issue-link requirement."
              invalid_relationship=true
              continue
            fi

            # #2003: `gh issue view <PR-number>` SUCCEEDS and returns the PR's
            # state, so a body like "Closes #<any-PR>" satisfies this gate
            # falsely. The captain's note is explicit: excluding only "the
            # current PR's number" is NOT enough — `Closes #<another-PR>` passes
            # just as falsely. We must exclude EVERY pull request, not just
            # this one. The discriminator is the `pull_request` key on the
            # issue-object endpoint: present (non-null) for PRs, absent for
            # real issues. A closing PR target invalidates the declaration;
            # a non-closing PR reference is allowed but cannot satisfy the gate.
            # A real issue has no `pull_request` key, so the expression prints
            # `false`; a PR has a non-null object and prints `true`.
            if ! is_pr=$(gh api "repos/${GH_REPO}/issues/${n}" --jq '.pull_request != null' 2>/dev/null); then
              echo "  #$n could not be verified as an existing issue — rejecting the declaration."
              invalid_relationship=true
              continue
            fi
            if [ "$is_pr" = "true" ]; then
              if [ "$is_closing" = "true" ]; then
                echo "  #$n is a pull request, not an issue — rejecting the closing declaration (#2003)."
                invalid_relationship=true
              else
                echo "  #$n is a non-closing pull-request reference — it does not satisfy the issue requirement."
              fi
              continue
            fi

            if state=$(gh issue view "$n" --json state --jq '.state' 2>/dev/null); then
              echo "✓ PR links issue #$n (state: $state)."
              linked_issue=true
              continue
            fi
            echo "  #$n is not an existing issue — rejecting the declaration."
            invalid_relationship=true
          done <<< "$relationships"


          if [ "$invalid_relationship" = "true" ]; then
            echo "::error::A closing relationship to a PR, a self-reference, or an unverifiable number invalidates the declaration."
            exit 1
          fi

          if [ "$linked_issue" = "true" ]; then
            exit 0
          fi

          echo "::error::The relationship keyword(s) reference no existing issue. Link a real issue with \"Closes #N\" or \"Part of #N\"."
          exit 1
