name: front characterization

on:
  pull_request:
    paths:
      - 'apps/front/**'
      - 'packages/shared-ts/**'
      - 'packages/client-ts/**'
      - 'packages/_tsconfig/**'
      - 'turbo.json'
      - '.github/workflows/front-characterization.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'

permissions:
  contents: read

jobs:
  front-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run trusted first-party postinstall (@org/shared-ts)
        run: pnpm --filter @org/shared-ts run postinstall

      - name: Check formatting
        run: pnpm format

      - name: Test current frontend unit characterization
        run: pnpm --filter front run test
