name: front-2 e2e

on:
  pull_request:
    paths:
      - 'apps/front-2/**'
      - 'packages/shared-ts/**'
      - 'packages/client-ts/**'
      - '.github/workflows/front-2-e2e.yml'
  push:
    branches:
      - develop
    paths:
      - 'apps/front-2/**'
      - 'packages/shared-ts/**'
      - 'packages/client-ts/**'
      - '.github/workflows/front-2-e2e.yml'

# Supersede in-flight runs for the same ref: a newer push makes an older run's
# result irrelevant, and on a private repo every superseded minute is billed.
# This is the most expensive workflow (docker build + Playwright), so it is
# also where cancelling superseded runs saves the most.
concurrency:
  group: front-2-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e2e images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Setup GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push stack images
        env:
          E2E_IMAGE_NS: ghcr.io/radandevist/publyapp-e2e
          E2E_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: docker buildx bake -f apps/front-2/docker-compose.test.yml --push

  test:
    name: front-2-e2e (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_IMAGE_NS: ghcr.io/radandevist/publyapp-e2e
      E2E_IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Assert exact pins
        run: node apps/front-2/scripts/assert-pinned.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull stack
        run: docker compose -f apps/front-2/docker-compose.test.yml pull

      - name: Up stack
        run: docker compose -f apps/front-2/docker-compose.test.yml up -d --no-build

      - name: Wait for front-2 stack health
        run: |
          timeout 180 bash -lc '
            for attempt in $(seq 1 90); do
              ids=(
                front-2
                api
                request-counter
                traefik
                toxiproxy
                postgres
              )

              all_running=true

              for service in "${ids[@]}"; do
                container_id="$(docker compose -f apps/front-2/docker-compose.test.yml ps -q "$service")"
                if [ -z "$container_id" ]; then
                  all_running=false
                  break
                fi

                state="$(docker inspect --format "{{.State.Status}}" "$container_id")"
                health="$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}" "$container_id")"

                if [ "$state" != "running" ]; then
                  all_running=false
                  break
                fi

                if [ "$health" != "healthy" ] && [ "$health" != "no-healthcheck" ]; then
                  all_running=false
                  break
                fi
              done

              docker ps --filter "name=publyapp-front2-real-test" --format "{{.Names}}\t{{.Status}}"

              if [ "$all_running" = true ]; then
                break
              fi

              sleep 2
            done

            if [ "$all_running" != true ]; then
              exit 1
            fi
          '

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run playwright browser tests
        env:
          PLAYWRIGHT_CI_SHARD: 'true'
        run: |
          pnpm --filter front-2 exec playwright install chromium --with-deps
          pnpm --filter front-2 exec playwright test \
            --project=chromium \
            --project=chromium-faults \
            --shard=${{ matrix.shard }}/4

          # The counter has global state within a stack. Keep it off the shared
          # shard invocation, then run it after setup on one otherwise-idle,
          # isolated stack. The unsharded config retains its dependency barrier.
          if [ "${{ matrix.shard }}" = "4" ]; then
            pnpm --filter front-2 exec playwright test --project=setup --no-deps
            pnpm --filter front-2 exec playwright test \
              --project=chromium-hermetic-counter \
              --no-deps
          fi

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: front-2-e2e-playwright-report-${{ matrix.shard }}-of-4
          path: |
            apps/front-2/playwright-report
            apps/front-2/test-results
          if-no-files-found: ignore

      - name: Tear down front-2 stack
        if: always()
        run: docker compose -f apps/front-2/docker-compose.test.yml down -v

  cleanup:
    name: Clean up e2e images
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      E2E_IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Delete run image versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$E2E_IMAGE_TAG" ]; then
            echo "::warning::Build did not emit an image tag; skipping GHCR cleanup."
            exit 0
          fi

          packages=(
            publyapp-e2e-migrate
            publyapp-e2e-api
            publyapp-e2e-request-counter
            publyapp-e2e-front-2
          )
          cleanup_failed=false

          for package in "${packages[@]}"; do
            if ! version_ids="$(
              gh api --paginate \
                "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions?per_page=100" \
                --jq ".[] | select(.metadata.container.tags | index(\"${E2E_IMAGE_TAG}\")) | .id"
            )"; then
              echo "::warning::Could not list GHCR versions for ${package}."
              cleanup_failed=true
              continue
            fi

            for version_id in $version_ids; do
              if ! gh api --method DELETE \
                "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/versions/${version_id}"; then
                echo "::warning::Could not delete GHCR version ${version_id} for ${package}."
                cleanup_failed=true
              fi
            done
          done

          if [ "$cleanup_failed" = true ]; then
            exit 1
          fi
