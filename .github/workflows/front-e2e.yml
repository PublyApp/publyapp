name: front e2e

# Re-running the FAILED JOBS of this workflow ("Re-run failed jobs") can
# never succeed. The e2e images are per-run scratch, tagged
# ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}, and the `cleanup` job (if:
# always()) deletes them when an attempt finishes — including when the
# shards failed, which is correct: nothing should retain scratch images, and
# a partial re-run must not silently test the previous attempt's build.
# Because "Re-run failed jobs" does not re-run the `build` job, the shards
# would pull the previous attempt's tag, which no longer exists — the pull
# fails with "manifest unknown", indistinguishable from a registry problem
# (observed on PR #1056). The "Detect partial re-run before pull" step in
# the `test` job detects this before pulling and fails loudly; the only
# working retry is a FULL workflow re-run ("Re-run all jobs"), which re-runs
# `build` and pushes a fresh image set. See docs/guides/local-ci-gate.md.
#
# Fork pull requests (#1021): a pull_request event originating from a fork
# gets a read-only GITHUB_TOKEN — GitHub strips `packages: write` regardless
# of contributor approval — so the GHCR push path cannot work there. Rather
# than switching to `pull_request_target` (which would hand fork-authored
# code a base-repository write-capable token: never acceptable here), the
# `build` job detects the fork case
# (`github.event.pull_request.head.repo.fork`) and takes a registry-free
# path: it skips the GHCR login/push AND the gha cache export (whose backend
# needs the runtime token forks do not get), saves the four built images to
# a tarball artifact, and each matrix shard loads them into its own local
# daemon with `docker load`. The images exist only under their local names
# inside each runner; nothing leaves GitHub. Same-repo PRs keep the GHCR
# push path unchanged (cache warmth + the shared-digest cleanup behaviour
# documented below). This workflow only ever runs on pull_request,
# merge_group, and push-to-develop; on merge_group/push the token carries
# full repository permissions, so the fork condition and an unavailable
# packages:write coincide exactly.

on:
  pull_request:
  # Required so this required check can report for a merge-queue entry: a
  # required Actions check missing this event waits forever once the entry
  # reaches the queue (GitHub's documented behavior), reproducing the exact
  # missing-check deadlock #1017 exists to remove — just under a merge queue
  # instead of an unfiltered `pull_request` trigger. The repository has no
  # merge-queue rule today, so this is dormant, but a required check that
  # cannot report under a supported GitHub feature is a latent version of
  # that bug.
  merge_group:
  push:
    branches:
      - develop
    paths:
      - 'apps/front/**'
      - 'packages/shared-ts/**'
      - 'packages/client-ts/**'
      - '.github/workflows/front-e2e.yml'

# Supersede in-flight runs for the same ref: a newer push makes an older run's
# result irrelevant, and on a private repo every superseded minute is billed.
# This is the most expensive workflow (docker build + Playwright), so it is
# also where cancelling superseded runs saves the most.
concurrency:
  group: front-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap first job: the pull_request trigger above has no `paths:` filter (a
  # path-filtered trigger never starts for an unrelated PR, so a required
  # status check gated only by the trigger would hang forever — see #1017).
  # This job always runs and decides whether the expensive jobs below should.
  changes:
    name: Determine changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Checked out from the BASE commit, not this pull request's own ref:
      # this pins the classifier a pull request is being evaluated against so
      # an accidental or careless edit (a rename, a bad rebase, editing the
      # wrong copy) cannot silently change the relevance decision.
      #
      # This is NOT a defense against a pull request that deliberately tries
      # to bypass its own gates. The `changes` job's YAML — including the
      # invocation step below, and this comment — is itself read from the
      # pull request's merge commit, the same as every other job in this
      # workflow. A pull request can already rewrite that step's `run:` to
      # print `relevant=true`/`false` unconditionally, or delete this
      # checkout, or anything else, exactly as freely as it could edit a
      # separate script file. Pinning the classifier's SOURCE closes the
      # narrower "an edit to ci-changed-paths.mjs itself is silently
      # honored" gap; it does not and cannot close the wider gap that the
      # workflow calling it is merge-commit-controlled. That wider gap is
      # tracked in #1022, with the honest framing: these gates defend against
      # mistakes, not a malicious author of a branch in this repository — the
      # real controls there are who can push branches and GitHub's
      # fork-approval requirement.
      #
      # This checkout can legitimately produce nothing: the pull request that
      # introduces this classifier (or a branch cut before it existed on the
      # base branch) has no such file at its base commit. The invocation step
      # below fails closed to relevant=true rather than crashing when that
      # happens.
      - name: Checkout classifier from the base commit (not the PR's own copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            packages/scripts-ts/src/ci-changed-paths.ts
          sparse-checkout-cone-mode: false
          path: base-ref

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Check whether front-e2e paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Same path groups the old `pull_request.paths` filter listed —
        # deliberately not widened or narrowed. The classifier itself
        # (packages/scripts-ts/src/ci-changed-paths.ts) fails closed to relevant=true when
        # the changed-file list can't be verified complete (GitHub's
        # 3,000-file API ceiling) rather than trusting a truncated list — see
        # packages/scripts-ts/src/ci-changed-paths.test.ts.
        #
        # The base-pinned checkout above can legitimately be empty (see its
        # comment). If so, this fails closed to relevant=true on a path that
        # never invokes the classifier at all, kept structurally separate
        # from the classifier's own answer so a real relevant=false can never
        # be mistaken for "missing" and vice versa. See
        # packages/scripts-ts/src/ci-gate-bootstrap.test.ts, which executes this exact
        # inline script (parsed from this file) against both cases.
        run: |
          CLASSIFIER=base-ref/packages/scripts-ts/src/ci-changed-paths.ts

          if [ -f "$CLASSIFIER" ]; then
            node "$CLASSIFIER" '^(apps/front/|packages/shared-ts/|packages/client-ts/|\.github/workflows/front-e2e\.yml$)'
          else
            echo "::warning::[MISSING BASE CLASSIFIER] $CLASSIFIER does not exist at the base commit. This is expected exactly once: for the pull request that introduces this classifier, or a branch cut before it existed on the base branch. Relevance cannot be determined from a classifier that is not there, so this fails closed: treating the workflow as relevant and running everything. If this keeps happening on ordinary pull requests well after the classifier has been on the base branch, something is wrong — investigate, do not silence it."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build e2e images
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
      fork: ${{ steps.fork.outputs.fork }}
      ns: ${{ steps.image-ns.outputs.root }}
    steps:
      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # #1362: owner-derived since the org move (radandevist -> PublyApp).
      # GHCR rejects uppercase in image paths and github.repository_owner is
      # "PublyApp", so lowercase it here. Nothing pre-existing under this
      # namespace is required: the build job builds all four images before
      # any push/pull, and the per-run scratch tags are created by this run.
      - name: Resolve lowercase e2e image namespace
        id: image-ns
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "root=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/publyapp-e2e" >> "$GITHUB_OUTPUT"

      - name: Detect fork pull request
        id: fork
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: echo "fork=$IS_FORK" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      - name: Setup GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Login to GHCR
        if: steps.fork.outputs.fork != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build stack images
        env:
          COMPOSE_BAKE: 'true'
          E2E_IMAGE_NS: ${{ steps.image-ns.outputs.root }}
          E2E_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        # On a fork run the gha cache backend has neither a writable cache
        # destination nor the runtime credentials it authenticates with, so
        # apps/front/docker-compose.fork-overlay.yml strips the four
        # services' cache_from/cache_to instead of letting the export fail
        # or silently degrade. Either way, the build loads all four images
        # into THIS runner's local docker daemon (verified locally: compose
        # bake hands the result back over the docker-container driver's
        # tarball bridge).
        run: |
          compose_files=(-f apps/front/docker-compose.test.yml)

          if [ "${{ steps.fork.outputs.fork }}" = "true" ]; then
            compose_files+=(-f apps/front/docker-compose.fork-overlay.yml)
          fi

          docker compose "${compose_files[@]}" build

      - name: Push stack images to GHCR (same-repo runs only)
        if: steps.fork.outputs.fork != 'true'
        env:
          E2E_IMAGE_NS: ${{ steps.image-ns.outputs.root }}
          E2E_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: docker compose -f apps/front/docker-compose.test.yml push migrate api request-counter front

      # #1628 round 10: build-artifact guard for the front image. Runs
      # AFTER `docker compose build` (which already loaded the front image
      # into this runner's local daemon via compose bake, both same-repo
      # and fork) and BEFORE any shard pulls it. The guard STARTS the
      # image as a container and waits for an actual HTTP response from
      # it — never just for "the process is running". A container that
      # crashes at startup with `ERR_MODULE_NOT_FOUND: Cannot find
      # module '/app/<file>'` is the exact shape the front fell into
      # when `trust-proxy.mjs` was added without a matching COPY in the
      # Dockerfile: nine rounds of "tests pass" were not enough to
      # catch it, because every other e2e test only fails downstream
      # with a generic "element(s) not found". This guard makes the
      # cause visible at the build step itself.
      #
      # It runs in the `build` job (not the matrix), so a regression
      # trips the build BEFORE the four shards each pay for a wasted
      # compose up + a 40s setup timeout. The guard's cause-of-failure
      # message names the missing module and the file that imported
      # it, so the operator does not have to read docker logs to
      # diagnose it.
      - name: Verify the built front image starts and serves HTTP
        env:
          E2E_IMAGE_NS: ${{ steps.image-ns.outputs.root }}
          E2E_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          node apps/front/scripts/ci/check-front-runtime-image.mts \
            --image "${E2E_IMAGE_NS}-front:${E2E_IMAGE_TAG}"

      # #1021: shards run on separate runners, so the build job's local
      # --load cannot hand the matrix its images; the registry-free
      # equivalent of the GHCR hop is a versioned-artifact handoff — save
      # the same four tagged images the push path would have published,
      # upload them, let every shard load them locally (see the `test`
      # job). retention-days: 1 keeps the multi-hundred-MB artifact around
      # only as long as the run's own shards (plus a failed-shard look).
      - name: Save stack images tarball (fork runs)
        if: steps.fork.outputs.fork == 'true'
        env:
          E2E_IMAGE_NS: ${{ steps.image-ns.outputs.root }}
          E2E_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/e2e-images

          for service in migrate api request-counter front; do
            docker save "${E2E_IMAGE_NS}-${service}:${E2E_IMAGE_TAG}" \
              | gzip > "/tmp/e2e-images/${service}.tar.gz"
            ls -lh "/tmp/e2e-images/${service}.tar.gz"
          done

      - name: Upload stack images artifact (fork runs)
        if: steps.fork.outputs.fork == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-stack-images-${{ steps.image-tag.outputs.tag }}
          path: /tmp/e2e-images/*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  test:
    name: front-e2e (${{ matrix.shard }}/4)
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Handed over from the build job so this can never drift from the
      # namespace the images were actually pushed under (#1362).
      E2E_IMAGE_NS: ${{ needs.build.outputs.ns }}
      E2E_IMAGE_TAG: ${{ needs.build.outputs.tag }}
      # Per-worktree isolation (#1642): docker compose indexes on the project
      # name, not the file path. Each CI run gets its own project name so the
      # `docker ps --filter name=...` diagnostic and teardown never touch
      # another run's stack (each shard runs on a fresh runner, but this keeps
      # the diagnostic filter correct and consistent with local justfile usage).
      # Include github.run_attempt so a partial re-run (same run_id, attempt 2)
      # gets a distinct project name and cannot recover a previous attempt's
      # volumes as initial state (#1642 Constat 5).
      COMPOSE_PROJECT_NAME: publyapp-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Assert exact pins
        run: node apps/front/scripts/run-guarded.mts apps/front/scripts/guards/assert-pinned.mts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Login to GHCR
        if: needs.build.outputs.fork != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # #1063 BLOCKER: on a partial re-run of failed jobs the `build` job is
      # NOT re-run, so needs.build.outputs.tag (E2E_IMAGE_TAG) still holds the
      # PREVIOUS attempt's tag — whose images the `cleanup` job already
      # deleted (if: always()). The pull would then fail with "manifest
      # unknown", indistinguishable from a registry problem (observed on PR
      # #1056). The per-run tag always embeds the current attempt number, so
      # comparing E2E_IMAGE_TAG against the current attempt's expected tag
      # detects the partial re-run BEFORE any pull attempt: a fresh run and a
      # full workflow re-run ("Re-run all jobs", which re-runs `build` and
      # re-pushes a fresh image set) both match; a partial re-run does not.
      # Fail loudly instead of attempting the pull. Scripts that run this
      # exact step: packages/scripts-ts/src/ci-e2e-rerun-guard.test.ts (executes this run:
      # body against the three scenarios) and
      # packages/scripts-ts/src/check-ci-drift.ts (hashes this step into the manifest).
      - name: Detect partial re-run before pull
        run: |
          set -euo pipefail

          expected_tag="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if [ -z "$E2E_IMAGE_TAG" ]; then
            echo "::error::The build job did not emit an image tag (needs.build.outputs.tag is empty), so there is nothing to pull."
            exit 1
          fi

          if [ "$E2E_IMAGE_TAG" != "$expected_tag" ]; then
            echo "::error::The build job produced image tag ${E2E_IMAGE_TAG}, but this attempt (${GITHUB_RUN_ATTEMPT}) expects ${expected_tag} — the build job was NOT re-run for this attempt, which means this is a partial re-run of failed jobs. The e2e images are per-run scratch: the cleanup job deleted the previous attempt's images when it finished, so pulling can only fail with \"manifest unknown\". A FULL WORKFLOW RE-RUN is required — use \"Re-run all jobs\" (which re-runs the build job and pushes a fresh image set), not \"Re-run failed jobs\"."
            exit 1
          fi

      - name: Pull stack
        if: needs.build.outputs.fork != 'true'
        run: docker compose -f apps/front/docker-compose.test.yml pull

      # #1021: on a fork run nothing was ever pushed to GHCR — the build
      # job handed its images over as a tarball artifact instead. Restore
      # them into this runner's local daemon before `up --no-build`
      # resolves the same ${E2E_IMAGE_NS}-${service}:${E2E_IMAGE_TAG} tags.
      - name: Load stack images from artifact (fork runs)
        if: needs.build.outputs.fork == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-stack-images-${{ needs.build.outputs.tag }}
          path: /tmp/e2e-images

      - name: Import stack images into the local daemon (fork runs)
        if: needs.build.outputs.fork == 'true'
        run: |
          set -euo pipefail

          for tarball in /tmp/e2e-images/*.tar.gz; do
            gunzip -c "$tarball" | docker load
          done

      - name: Up stack
        run: docker compose -f apps/front/docker-compose.test.yml up -d --no-build

      - name: Wait for front stack health
        run: |
          timeout 180 bash -lc '
            for attempt in $(seq 1 90); do
              ids=(
                front
                api
                request-counter
                traefik
                toxiproxy
                postgres
              )

              all_running=true

              for service in "${ids[@]}"; do
                container_id="$(docker compose -f apps/front/docker-compose.test.yml ps -q "$service")"
                if [ -z "$container_id" ]; then
                  all_running=false
                  break
                fi

                state="$(docker inspect --format "{{.State.Status}}" "$container_id")"
                health="$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}" "$container_id")"

                if [ "$state" != "running" ]; then
                  all_running=false
                  break
                fi

                if [ "$health" != "healthy" ] && [ "$health" != "no-healthcheck" ]; then
                  all_running=false
                  break
                fi
              done

              docker ps --filter "name=${COMPOSE_PROJECT_NAME}" --format "{{.Names}}\t{{.Status}}"

              if [ "$all_running" = true ]; then
                break
              fi

              sleep 2
            done

            if [ "$all_running" != true ]; then
              exit 1
            fi
          '

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run playwright browser tests
        env:
          PLAYWRIGHT_CI_SHARD: 'true'
        # BLOCKER fix (round 5): GitHub's documented unspecified-shell default
        # is `bash -e {0}`, but that is a property of the SURROUNDING job/
        # workflow, not this script — a `defaults: run: shell: bash {0}`
        # override (job- or workflow-level) silently drops the `-e`, and a
        # review round proved that with it, a failed `playwright test`
        # command followed by the last-shard `if` below reports success.
        # `set -euo pipefail` makes fail-fast a property of this script
        # itself, independent of whatever shell default is (or later
        # becomes) in effect around it. packages/scripts-ts/src/check-ci-gate-structure.ts
        # additionally hard-rejects a `defaults:` override on this job/
        # workflow directly, as a second, independent layer.
        run: |
          set -euo pipefail

          pnpm --filter front exec playwright install chromium --with-deps
          pnpm --filter front exec playwright test \
            --project=chromium \
            --project=chromium-faults \
            --shard=${{ matrix.shard }}/4

          # The counter has global state within a stack. Keep it off the shared
          # shard invocation, then run it after setup on one otherwise-idle,
          # isolated stack. The unsharded config retains its dependency barrier.
          if [ "${{ matrix.shard }}" = "4" ]; then
            pnpm --filter front exec playwright test --project=setup --no-deps
            pnpm --filter front exec playwright test \
              --project=chromium-hermetic-counter \
              --no-deps

            # #973 round-3 review BLOCKER: chromium-hermetic-source (the
            # breadcrumb entity-name truncation proof) needs no login,
            # backend, or docker-compose stack, but the matrix above only
            # ever selects chromium/chromium-faults/chromium-hermetic-
            # counter — this project never ran in CI. Runs once here (not
            # once per shard) since it has no `dependencies` of its own and
            # nothing about it is shard-specific.
            pnpm --filter front exec playwright test \
              --project=chromium-hermetic-source

            # Round 19 I3: the drawer-description contrast source guard
            # (drawer-description-contrast.test.ts) is the only browser-
            # launching test in the front unit suite. It is excluded from the
            # ordinary `pnpm --filter front test` lane (vitest.config.ts) and
            # runs here, once per run, in the lane that already installs the
            # Chromium the guard launches itself — the same lane that gates
            # the real drawer spec, so the synthetic guard cannot be
            # provisioned cheaper anywhere else. Round 21: run through the
            # `test:drawer-contrast` package script so CI and the local gate
            # (`just ci-e2e-front`) invoke the identical command. Fails the
            # job on any drawer-contrast regression.
            pnpm --filter front test:drawer-contrast
          fi

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: front-e2e-playwright-report-${{ matrix.shard }}-of-4
          path: |
            apps/front/playwright-report
            apps/front/test-results
          if-no-files-found: ignore

      - name: Tear down front stack
        if: always()
        run: docker compose -f apps/front/docker-compose.test.yml down -v

  cleanup:
    name: Clean up e2e images
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      E2E_IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      # Round-1 fix (PR #1396): the step below runs
      # `node packages/scripts-ts/src/ci-e2e-cleanup.ts`, but this job shipped
      # WITHOUT a checkout or any toolchain setup — an Actions runner starts
      # empty, so `node` resolved nothing and the module path did not exist
      # ("Cannot find module /home/runner/work/publyapp/publyapp/packages/
      # scripts-ts/src/ci-e2e-cleanup.ts"), turning the cleanup — and with it
      # front-e2e-gate — red on every run. Same pinned actions, in the same
      # order, as every other job in this workflow that runs repository code.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # #1018: a cleanup that cannot delete is a broken check, not a green one,
      # so there is NO continue-on-error here — any failure fails the job (and
      # therefore the required gate). The decision logic lives in an injectable,
      # unit-tested script rather than inline shell:
      # packages/scripts-ts/src/ci-e2e-cleanup.ts, whose co-located suite
      # (ci-e2e-cleanup.test.ts) is the executable spec for every branch:
      #
      # - A VERSION is deleted only when its re-read tag list (immediately
      #   before the delete) is exactly [this run's tag]: content-stable
      #   images (request-counter) push an identical digest every run, so GHCR
      #   adds this run's tag to a version other runs already share — deleting
      #   that version would break every run still referencing the digest, so
      #   shared versions are skipped. A tag added concurrently between the
      #   listing and the re-read is caught and the delete skipped.
      # - When GitHub answers the version delete with the documented HTTP 400
      #   "You cannot delete the last tagged version of a package", the
      #   PACKAGE is deleted instead (#1362 round 1: this run's own GHCR push
      #   created — or left behind — the package's ONLY tagged version, and
      #   GitHub documents deleting the package for that case). The package
      #   delete is race-guarded: it happens only when a safety re-list still
      #   shows exactly {this run's version} carrying exactly [this run's
      #   tag]; anything else falls back to the plain version delete.
      # - The package-API owner scope is derived from GET /users/{owner} →
      #   .type at runtime (/orgs/{owner}/... for an organization, /user/...
      #   for a user) because the API is owner-type-scoped and #1362 moved
      #   this repository from radandevist to the PublyApp organization;
      #   nothing is hard-coded.
      # - Every refusal fails loudly with GitHub's exact message. A 403 means
      #   the GITHUB_TOKEN lacks package-admin access for the package; the
      #   owner must grant it via the package's "Manage Actions access"
      #   (repository publyapp, role Admin). Public packages past the
      #   5000-download threshold refuse version deletion with HTTP 400; the
      #   public → private visibility flip that would make deletion possible
      #   remains a separate owner decision, tracked in #1018.
      # #1021: a fork run pushed nothing to GHCR (its token is read-only), so
      # the fast paths below — re-asserted inside the script itself, where they
      # are unit-tested — short-circuit to success without touching the
      # registry, and the aggregate gate keeps aggregating real results on
      # fork PRs.
      - name: Delete run image versions
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_RUN: ${{ needs.build.outputs.fork }}
        run: |
          set -euo pipefail

          # Fast paths kept visible at the workflow layer; the script
          # re-checks both (unit-tested) because it must also be safe when
          # executed directly.
          if [ "$FORK_RUN" = "true" ]; then
            echo "::notice::Fork run: no images were pushed to GHCR, so there is nothing to clean up."
            exit 0
          fi

          if [ -z "$E2E_IMAGE_TAG" ]; then
            echo "::warning::Build did not emit an image tag; skipping GHCR cleanup."
            exit 0
          fi

          node packages/scripts-ts/src/ci-e2e-cleanup.ts

  # Required status check: this is the one context that should be required
  # on the branch ruleset instead of a per-shard `front-e2e (N/4)` name. It
  # always reports (if: always()), passes when upstream jobs succeeded or
  # were skipped (irrelevant PR), and fails on any real failure or
  # cancellation rather than treating either as "not applicable".
  gate:
    # BLOCKER fix (round 5, corrected): an event-guarded `if:` alone left
    # this job SKIPPED (not absent) on a push-triggered run, and GitHub
    # still creates and reports a check run named "front-e2e-gate" for a
    # skipped job -- just with conclusion "skipped" instead of a real
    # pass/fail. Verified live: PR #1029's own head commit still carried
    # TWO "front-e2e-gate" check runs for the same SHA (one "success",
    # one "skipped"), which is the same "one required context, two
    # reports, last one wins" nondeterminism this fix exists to remove --
    # it had only changed what the second report said, not whether it
    # existed. Fixed instead by renaming: `name:` is now conditional on
    # the event, so a run triggered by anything other than a pull request
    # or a merge-queue entry reports under a DIFFERENT, non-required
    # context ("front-e2e-push-check") that can never collide with
    # "front-e2e-gate". `if:` goes back to unconditional `always()` so
    # the push-triggered run still aggregates and reports a REAL pass/fail
    # (useful direct-push/post-merge validation) instead of an
    # uninformative skip.
    #
    # Round 6 BLOCKER: the condition is an ALLOWLIST, not `!= 'push'`. The
    # earlier `github.event_name == 'push' && ... || ...` form resolved to
    # the REQUIRED name for every event that was not `push`, so simply
    # adding `workflow_dispatch:` to this workflow's `on:` produced a
    # second reporter of "front-e2e-gate" for the same commit -- a manual run
    # takes a branch/tag ref and uses its last commit as GITHUB_SHA -- and
    # both enforced guards stayed green. Only `pull_request` and
    # `merge_group` may resolve to the required name.
    # packages/scripts-ts/src/check-ci-gate-structure.ts pins this exact expression, caps
    # this workflow's `on:` to pull_request/merge_group/push, and scans
    # every job in every workflow in the repository so no other job can
    # report one of the four required names either.
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'front-e2e-gate' || 'front-e2e-push-check' }}
    if: always()
    needs: [changes, build, test, cleanup]
    runs-on: ubuntu-latest
    steps:
      # Reads the `needs` context directly (via toJSON) instead of a
      # hand-written per-job map: a job added to `needs` above without also
      # being added to a hand-maintained Bash list would silently never be
      # checked (round-2 review). `needs` is populated by Actions from this
      # job's own `needs:` keyword, so there is no second list to omit an
      # entry from.
      - name: Check required jobs
        id: check-required-jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # Fail closed on anything outside the exact documented shape: a
        # nonempty JSON object whose every entry's result is exactly
        # "success" or "skipped" (GitHub documents only
        # success/failure/cancelled/skipped for needs.<job>.result — see
        # packages/scripts-ts/src/ci-gate-aggregation.test.ts). An empty object/array, a
        # missing `.result`, or an unrecognized result value (a documented
        # future addition, a typo, a job whose result GitHub reports in a
        # shape this was not written against) must never silently pass
        # "nothing to flag" — and neither may examining zero jobs.
        #
        # BLOCKER fix: treating every "skipped" result as a pass — the
        # original shape of this check — let a review round prove `changes`
        # succeeding with an absent/empty `relevant` output plus every heavy
        # job skipped as green: skipped work was never correlated with the
        # classifier's own answer, so "skipped" was accepted as proof of
        # nothing. This step now also asserts `needs.changes.result ==
        # "success"`, requires `needs.changes.outputs.relevant` to be
        # EXACTLY the string "true" or "false" (GitHub can omit a job output
        # entirely — including because it may contain a secret — so an
        # absent/empty/malformed value fails closed rather than being read as
        # a green light), and only allows a required job to be "skipped" when
        # relevant is exactly "false". When relevant is "true", every
        # required job (including one whose skip was actually caused by an
        # upstream failure cascading a default skip) must be "success".
        run: |
          if [ "$(echo "$NEEDS_JSON" | jq -r 'type')" != "object" ]; then
            echo "::error::NEEDS_JSON is not a JSON object — examining nothing must never pass."
            exit 1
          fi

          if [ "$(echo "$NEEDS_JSON" | jq 'length')" -eq 0 ]; then
            echo "::error::NEEDS_JSON has no entries — examining zero jobs must never pass."
            exit 1
          fi

          echo "Required jobs and their results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          changes_result="$(echo "$NEEDS_JSON" | jq -r '.changes.result // "MISSING"')"

          if [ "$changes_result" != "success" ]; then
            echo "::error::needs.changes.result must be exactly \"success\" (found: \"$changes_result\"). Nothing downstream can be trusted if the changed-paths classifier itself did not run to completion."
            exit 1
          fi

          relevant="$(echo "$NEEDS_JSON" | jq -r '.changes.outputs.relevant // "MISSING"')"

          if [ "$relevant" != "true" ] && [ "$relevant" != "false" ]; then
            echo "::error::needs.changes.outputs.relevant must be exactly the string \"true\" or \"false\" (found: \"$relevant\"). GitHub can omit a job output entirely — including because it may contain a secret — so an absent, empty, or otherwise malformed relevance signal must never be treated as license to accept skipped verification work."
            exit 1
          fi

          if [ "$relevant" = "true" ]; then
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select(.result != "success")] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::The changes classifier reported this change as relevant, so every required job must have actually run and succeeded (skipped is not acceptable) — but one or more did not (see results above)."
              exit 1
            fi
          else
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select((.result == "success" or .result == "skipped") | not)] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::One or more required jobs did not report success or skipped (failure, cancelled, or an unrecognized result value)."
              exit 1
            fi
          fi

          echo "All required jobs passed, or were correctly skipped for a verified-irrelevant change."

      # BLOCKER fix (round 5): `continue-on-error: true` added to the step
      # above would make its reported CONCLUSION "success" even after it
      # printed `::error::` and exited 1 — masking a correctly-detected
      # aggregation failure the same way it masks a verification step's
      # failure. GitHub computes a step's `outcome` BEFORE continue-on-error
      # is applied (only `conclusion` is rewritten afterward), so reading
      # `steps.check-required-jobs.outcome` here is not fooled by
      # continue-on-error on that step. `if: always()` so this still runs
      # (and still fails the job) even if the step above failed for real
      # without continue-on-error. packages/scripts-ts/src/check-ci-gate-structure.ts
      # separately hard-rejects continue-on-error anywhere in this job, as
      # an independent second layer.
      - name: Verify the required-jobs check truly succeeded (continue-on-error cannot mask this)
        if: always()
        run: |
          outcome="${{ steps.check-required-jobs.outcome }}"

          if [ "$outcome" != "success" ]; then
            echo "::error::steps.check-required-jobs.outcome was \"$outcome\", not \"success\". continue-on-error can rewrite a step's CONCLUSION but not its OUTCOME, so a masked required-jobs check failure is still caught here."
            exit 1
          fi
