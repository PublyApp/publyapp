name: front supply-chain

on:
  pull_request:
  # Required so this required check can report for a merge-queue entry: a
  # required Actions check missing this event waits forever once the entry
  # reaches the queue (GitHub's documented behavior), reproducing the exact
  # missing-check deadlock #1017 exists to remove — just under a merge queue
  # instead of an unfiltered `pull_request` trigger. The repository has no
  # merge-queue rule today, so this is dormant, but a required check that
  # cannot report under a supported GitHub feature is a latent version of
  # that bug.
  merge_group:

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a newer push makes an older run's
# result irrelevant, and on a private repo every superseded minute is billed.
concurrency:
  group: front-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap first job: the pull_request trigger above has no `paths:` filter (a
  # path-filtered trigger never starts for an unrelated PR, so a required
  # status check gated only by the trigger would hang forever — see #1017).
  # This job always runs and decides whether the expensive job below should.
  changes:
    name: Determine changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Checked out from the BASE commit, not this pull request's own ref:
      # this pins the classifier a pull request is being evaluated against so
      # an accidental or careless edit (a rename, a bad rebase, editing the
      # wrong copy) cannot silently change the relevance decision.
      #
      # This is NOT a defense against a pull request that deliberately tries
      # to bypass its own gates. The `changes` job's YAML — including the
      # invocation step below, and this comment — is itself read from the
      # pull request's merge commit, the same as every other job in this
      # workflow. A pull request can already rewrite that step's `run:` to
      # print `relevant=true`/`false` unconditionally, or delete this
      # checkout, or anything else, exactly as freely as it could edit a
      # separate script file. Pinning the classifier's SOURCE closes the
      # narrower "an edit to ci-changed-paths.mjs itself is silently
      # honored" gap; it does not and cannot close the wider gap that the
      # workflow calling it is merge-commit-controlled. That wider gap is
      # tracked in #1022, with the honest framing: these gates defend against
      # mistakes, not a malicious author of a branch in this repository — the
      # real controls there are who can push branches and GitHub's
      # fork-approval requirement.
      #
      # This checkout can legitimately produce nothing: the pull request that
      # introduces this classifier (or a branch cut before it existed on the
      # base branch) has no such file at its base commit. The invocation step
      # below fails closed to relevant=true rather than crashing when that
      # happens.
      - name: Checkout classifier from the base commit (not the PR's own copy)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            scripts/ci-changed-paths.mjs
          sparse-checkout-cone-mode: false
          path: base-ref

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check whether front-ci paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Same path groups the old `pull_request.paths` filter listed, plus
        # `scripts/**`: #1017 also closes the gap where scripts/ had no CI
        # lint coverage at all, and its lint check now lives in this job's
        # "Lint front" step, so this job must wake up for scripts-only PRs.
        # The classifier itself (scripts/ci-changed-paths.mjs) fails closed
        # to relevant=true when the changed-file list can't be verified
        # complete (GitHub's 3,000-file API ceiling) — see
        # scripts/ci-changed-paths.test.mjs.
        #
        # Also includes the other three #1017 aggregate-gate workflow files
        # (front-e2e.yml, openapi-spec-drift.yml, docs-archive.yml), not just
        # this one: the `gate-selftest` job below runs
        # scripts/check-ci-gate-structure.mjs and the four new gate test
        # suites, which parse and assert against ALL FOUR workflow files —
        # server-enforcing the guards those files depend on requires waking
        # up for an edit to any of them, or an edit to one of the other three
        # could regress unnoticed by CI even though this repo's only
        # server-side runner of those tests lives here. Pinned as a
        # requirement in scripts/check-ci-gate-structure.mjs itself (see its
        # `selfTestCoverage` check), so this pattern cannot narrow silently.
        #
        # The base-pinned checkout above can legitimately be empty (see its
        # comment). If so, this fails closed to relevant=true on a path that
        # never invokes the classifier at all, kept structurally separate
        # from the classifier's own answer so a real relevant=false can never
        # be mistaken for "missing" and vice versa. See
        # scripts/ci-gate-bootstrap.test.mjs, which executes this exact
        # inline script (parsed from this file) against both cases.
        run: |
          CLASSIFIER=base-ref/scripts/ci-changed-paths.mjs

          if [ -f "$CLASSIFIER" ]; then
            node "$CLASSIFIER" '^(apps/front/|packages/shared-ts/|packages/client-ts/|packages/_tsconfig/|scripts/|turbo\.json$|\.github/workflows/(front-ci|front-e2e|openapi-spec-drift|docs-archive)\.yml$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.npmrc$)'
          else
            echo "::warning::[MISSING BASE CLASSIFIER] $CLASSIFIER does not exist at the base commit. This is expected exactly once: for the pull request that introduces this classifier, or a branch cut before it existed on the base branch. Relevance cannot be determined from a classifier that is not there, so this fails closed: treating the workflow as relevant and running everything. If this keeps happening on ordinary pull requests well after the classifier has been on the base branch, something is wrong — investigate, do not silence it."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  supply-chain:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Assert exact pins
        run: node apps/front/scripts/assert-pinned.mjs

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run trusted first-party postinstall (@org/shared-ts)
        run: pnpm --filter @org/shared-ts run postinstall

      - name: Check front formatting
        run: pnpm format

      - name: Build front
        run: pnpm --filter front build

      - name: Verify front production build emits a CSS asset
        run: node apps/front/scripts/verify-build-css-link.mjs

      - name: Smoke start front server and verify stylesheet tag
        env:
          PUBLIC_API_BASE_URL: 'http://127.0.0.1:5000'
          SERVER_API_BASE_URL: 'http://127.0.0.1:5000'
        run: |
          pnpm --filter front start > /tmp/front-ci-server.log 2>&1 &
          FRONT_SERVER_PID=$!
          trap 'kill $FRONT_SERVER_PID || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/front-home.html; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:3000/ > /tmp/front-home.html; then
            echo "front standalone server failed to return HTML from /"
            cat /tmp/front-ci-server.log
            exit 1
          fi

          if ! grep -aEq 'rel="stylesheet"[^>]*href="[^"]+\.css"' /tmp/front-home.html; then
            echo "front production HTML does not contain stylesheet link"
            cat /tmp/front-home.html
            exit 1
          fi

      - name: Typecheck front
        run: pnpm --filter front typecheck

      - name: Lint front
        run: |
          npx oxlint --quiet apps/front packages/shared-ts scripts
          pnpm lint:disables
          pnpm check:frontend-barrels

      - name: Check front design system
        run: pnpm --filter front check:design-system

      - name: Test front
        run: pnpm --filter front test

  # IMPORTANT fix: the four #1017 aggregate-gate test suites and the
  # scripts/check-ci-gate-structure.mjs CLI were reachable only through local
  # `just ci-drift` — no workflow invoked them. A review confirmed against a
  # real job log that server CI ran lint/design-system/front tests but none
  # of the gate guard's own tests, so every guard #1017 added was, on the
  # server, unenforced: local policy is not enforcement. This job runs the
  # exact same commands `just ci-drift` runs, server-side, gated by the same
  # relevance classifier above (widened to also cover the other three gate
  # workflow files — see the "Check whether front-ci paths changed" step's
  # comment), and folded into front-ci-gate below so it cannot silently stop
  # being required without also failing scripts/check-ci-gate-structure.mjs's
  # "gate.needs must equal every other job in the file" check.
  gate-selftest:
    name: CI gate guard self-test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run CI gate guard tests (mirrors `just ci-drift`)
        run: |
          node --test ./scripts/check-ci-drift.test.mjs
          node ./scripts/check-ci-drift.mjs
          node --test ./scripts/ci-changed-paths.test.mjs
          node --test ./scripts/ci-gate-bootstrap.test.mjs
          node --test ./scripts/ci-gate-aggregation.test.mjs
          node --test ./scripts/check-ci-gate-structure.test.mjs
          node ./scripts/check-ci-gate-structure.mjs

  # Required status check: this is the one context that should be required
  # on the branch ruleset instead of relying on the trigger. It always
  # reports (if: always()), passes when upstream jobs succeeded or were
  # skipped (irrelevant PR), and fails on any real failure or cancellation
  # rather than treating either as "not applicable".
  #
  # BLOCKER fix (round 5): `if:` also requires the event to be `pull_request`
  # or `merge_group`. This workflow has no `push` trigger today, but the
  # other three #1017 gate workflows do, and one of them (docs-archive.yml)
  # proved live at this PR's own head commit that a push-triggered run of the
  # same commit as an open pull request can ALSO report a required context —
  # GitHub keeps only the LATEST reported status, so a slower push run could
  # overwrite a passing pull_request run. Applied here too, uniformly, so a
  # `push` trigger added to this file later inherits the same protection
  # instead of needing a separate fix rediscovered from scratch.
  gate:
    name: front-ci-gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [changes, supply-chain, gate-selftest]
    runs-on: ubuntu-latest
    steps:
      # BLOCKER fix (round 5): `gate-selftest` above runs
      # scripts/check-ci-gate-structure.mjs (among other things) server-side,
      # but only as long as it stays connected to THIS job's `needs:` — a
      # review round proved that dropping `gate-selftest` from `needs` makes
      # the selftest job itself go red, but disconnects it from
      # `front-ci-gate`, which stayed green: the decisive "gate.needs must
      # equal every other job in the file" check inside
      # check-ci-gate-structure.mjs was only ever invoked from a job that
      # could itself be the thing removed from `needs`. This step runs that
      # exact same script again, but as one of THIS job's own steps — the one
      # externally required context — so it cannot be silently disconnected
      # the way a whole job can. Only a direct edit to this job's own steps
      # could remove it, which is the accepted #1022 malicious-author gap
      # (a pull request can rewrite its own merge-commit YAML arbitrarily),
      # not the accidental-disconnection gap this closes. Since this script
      # parses all four #1017 gate workflow files, it also re-derives (from
      # inside the one required context that cannot be conditionally
      # disconnected) that front-e2e.yml, openapi-spec-drift.yml, and
      # docs-archive.yml's own gate.needs are each still complete.
      #
      # Gated on `relevant` like this job's siblings: any edit capable of
      # tripping this check is necessarily an edit to one of the four gate
      # workflow files, which the classifier above (widened to cover all
      # four, pinned by check-ci-gate-structure.mjs's selfTestCoverage check)
      # always classifies relevant=true for.
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        if: needs.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - name: Setup Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install (frozen lockfile, no scripts)
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the aggregate-gate job graph from inside the required job itself
        if: needs.changes.outputs.relevant == 'true'
        run: node ./scripts/check-ci-gate-structure.mjs

      # Reads the `needs` context directly (via toJSON) instead of a
      # hand-written per-job map: a job added to `needs` above without also
      # being added to a hand-maintained Bash list would silently never be
      # checked (round-2 review). `needs` is populated by Actions from this
      # job's own `needs:` keyword, so there is no second list to omit an
      # entry from.
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # Fail closed on anything outside the exact documented shape: a
        # nonempty JSON object whose every entry's result is exactly
        # "success" or "skipped" (GitHub documents only
        # success/failure/cancelled/skipped for needs.<job>.result — see
        # scripts/ci-gate-aggregation.test.mjs). An empty object/array, a
        # missing `.result`, or an unrecognized result value (a documented
        # future addition, a typo, a job whose result GitHub reports in a
        # shape this was not written against) must never silently pass
        # "nothing to flag" — and neither may examining zero jobs.
        #
        # BLOCKER fix: treating every "skipped" result as a pass — the
        # original shape of this check — let a review round prove `changes`
        # succeeding with an absent/empty `relevant` output plus every heavy
        # job skipped as green: skipped work was never correlated with the
        # classifier's own answer, so "skipped" was accepted as proof of
        # nothing. This step now also asserts `needs.changes.result ==
        # "success"`, requires `needs.changes.outputs.relevant` to be
        # EXACTLY the string "true" or "false" (GitHub can omit a job output
        # entirely — including because it may contain a secret — so an
        # absent/empty/malformed value fails closed rather than being read as
        # a green light), and only allows a required job to be "skipped" when
        # relevant is exactly "false". When relevant is "true", every
        # required job (including one whose skip was actually caused by an
        # upstream failure cascading a default skip) must be "success".
        run: |
          if [ "$(echo "$NEEDS_JSON" | jq -r 'type')" != "object" ]; then
            echo "::error::NEEDS_JSON is not a JSON object — examining nothing must never pass."
            exit 1
          fi

          if [ "$(echo "$NEEDS_JSON" | jq 'length')" -eq 0 ]; then
            echo "::error::NEEDS_JSON has no entries — examining zero jobs must never pass."
            exit 1
          fi

          echo "Required jobs and their results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          changes_result="$(echo "$NEEDS_JSON" | jq -r '.changes.result // "MISSING"')"

          if [ "$changes_result" != "success" ]; then
            echo "::error::needs.changes.result must be exactly \"success\" (found: \"$changes_result\"). Nothing downstream can be trusted if the changed-paths classifier itself did not run to completion."
            exit 1
          fi

          relevant="$(echo "$NEEDS_JSON" | jq -r '.changes.outputs.relevant // "MISSING"')"

          if [ "$relevant" != "true" ] && [ "$relevant" != "false" ]; then
            echo "::error::needs.changes.outputs.relevant must be exactly the string \"true\" or \"false\" (found: \"$relevant\"). GitHub can omit a job output entirely — including because it may contain a secret — so an absent, empty, or otherwise malformed relevance signal must never be treated as license to accept skipped verification work."
            exit 1
          fi

          if [ "$relevant" = "true" ]; then
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select(.result != "success")] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::The changes classifier reported this change as relevant, so every required job must have actually run and succeeded (skipped is not acceptable) — but one or more did not (see results above)."
              exit 1
            fi
          else
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select((.result == "success" or .result == "skipped") | not)] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::One or more required jobs did not report success or skipped (failure, cancelled, or an unrecognized result value)."
              exit 1
            fi
          fi

          echo "All required jobs passed, or were correctly skipped for a verified-irrelevant change."
