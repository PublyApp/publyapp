name: front supply-chain

on:
  pull_request:
  # Required so this required check can report for a merge-queue entry: a
  # required Actions check missing this event waits forever once the entry
  # reaches the queue (GitHub's documented behavior), reproducing the exact
  # missing-check deadlock #1017 exists to remove — just under a merge queue
  # instead of an unfiltered `pull_request` trigger. The repository has no
  # merge-queue rule today, so this is dormant, but a required check that
  # cannot report under a supported GitHub feature is a latent version of
  # that bug.
  merge_group:

permissions:
  contents: read

# Supersede in-flight runs for the same ref: a newer push makes an older run's
# result irrelevant, and on a private repo every superseded minute is billed.
concurrency:
  group: front-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap first job: the pull_request trigger above has no `paths:` filter (a
  # path-filtered trigger never starts for an unrelated PR, so a required
  # status check gated only by the trigger would hang forever — see #1017).
  # This job always runs and decides whether the expensive job below should.
  changes:
    name: Determine changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # Checked out from the BASE commit, not this pull request's own ref:
      # this pins the classifier a pull request is being evaluated against so
      # an accidental or careless edit (a rename, a bad rebase, editing the
      # wrong copy) cannot silently change the relevance decision.
      #
      # This is NOT a defense against a pull request that deliberately tries
      # to bypass its own gates. The `changes` job's YAML — including the
      # invocation step below, and this comment — is itself read from the
      # pull request's merge commit, the same as every other job in this
      # workflow. A pull request can already rewrite that step's `run:` to
      # print `relevant=true`/`false` unconditionally, or delete this
      # checkout, or anything else, exactly as freely as it could edit a
      # separate script file. Pinning the classifier's SOURCE closes the
      # narrower "an edit to ci-changed-paths.mjs itself is silently
      # honored" gap; it does not and cannot close the wider gap that the
      # workflow calling it is merge-commit-controlled. That wider gap is
      # tracked in #1022, with the honest framing: these gates defend against
      # mistakes, not a malicious author of a branch in this repository — the
      # real controls there are who can push branches and GitHub's
      # fork-approval requirement.
      #
      # This checkout can legitimately produce nothing: the pull request that
      # introduces this classifier (or a branch cut before it existed on the
      # base branch) has no such file at its base commit. The invocation step
      # below fails closed to relevant=true rather than crashing when that
      # happens.
      - name: Checkout classifier from the base commit (not the PR's own copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            packages/scripts-ts/src/ci-changed-paths.ts
          sparse-checkout-cone-mode: false
          path: base-ref

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Check whether front-ci paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Same path groups the old `pull_request.paths` filter listed, plus
        # `packages/scripts-ts/**`: #1017 also closes the gap where scripts/ had no CI
        # lint coverage at all, and its lint check now lives in this job's
        # "Lint front" step, so this job must wake up for scripts-only PRs.
        # The classifier itself (packages/scripts-ts/src/ci-changed-paths.ts) fails closed
        # to relevant=true when the changed-file list can't be verified
        # complete (GitHub's 3,000-file API ceiling) — see
        # packages/scripts-ts/src/ci-changed-paths.test.ts.
        #
        # Also includes EVERY file under .github/workflows/, not just this
        # one: the `gate-selftest` job below and this workflow's own `gate`
        # job run packages/scripts-ts/src/check-ci-gate-structure.ts, whose round-6
        # required-context uniqueness scan parses and asserts against every
        # workflow in the repository — any one of them can claim a required
        # check name. Server-enforcing that requires waking up for an edit to
        # any workflow file, not just the four gate files: the reviewer's
        # reproduction made a now-deleted `old-front-characterization.yml` report
        # "docs-archive-gate", and under the previous four-file pattern that
        # edit classified as irrelevant, so the one job that runs the scan
        # never woke up. The prefix form (no file list) also covers workflow
        # files that do not exist yet. Pinned as a requirement in
        # packages/scripts-ts/src/check-ci-gate-structure.ts itself (see its
        # `selfTestCoverage` check, which includes a path for a
        # not-yet-existing workflow file precisely so this cannot narrow back
        # to an enumerated list), so this pattern cannot narrow silently.
        #
        # The base-pinned checkout above can legitimately be empty (see its
        # comment). If so, this fails closed to relevant=true on a path that
        # never invokes the classifier at all, kept structurally separate
        # from the classifier's own answer so a real relevant=false can never
        # be mistaken for "missing" and vice versa. See
        # packages/scripts-ts/src/ci-gate-bootstrap.test.ts, which executes this exact
        # inline script (parsed from this file) against both cases.
        run: |
          CLASSIFIER=base-ref/packages/scripts-ts/src/ci-changed-paths.ts

          if [ -f "$CLASSIFIER" ]; then
          node "$CLASSIFIER" '^(apps/front/|packages/shared-ts/|packages/client-ts/|packages/_tsconfig/|packages/scripts-ts/|turbo\.json$|\.github/workflows/|\.github/actions/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.npmrc$)'
          else
            echo "::warning::[MISSING BASE CLASSIFIER] $CLASSIFIER does not exist at the base commit. This is expected exactly once: for the pull request that introduces this classifier, or a branch cut before it existed on the base branch. Relevance cannot be determined from a classifier that is not there, so this fails closed: treating the workflow as relevant and running everything. If this keeps happening on ordinary pull requests well after the classifier has been on the base branch, something is wrong — investigate, do not silence it."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  supply-chain:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Assert exact pins
        run: node apps/front/scripts/guards/assert-pinned.mts

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run trusted first-party postinstall (@org/shared-ts)
        run: pnpm --filter @org/shared-ts run postinstall

      # #1644: lower the production-graph audit threshold from `high` to
      # `moderate`, aligning it with the dev-graph gate (#1631/quality-gate.yml).
      # The previous shape let a moderate advisory in a production dep slip
      # through both audits: --prod excludes the dev graph, and --audit-level=high
      # excludes moderate. The production graph is clean at every threshold
      # today (0 advisories at critical/high/moderate/low — reproduce with
      # `pnpm audit --prod --audit-level=low`), so the cost is zero and the
      # safety is immediate.
      - name: Audit production dependencies (moderate and above)
        run: pnpm audit --prod --audit-level=moderate

      - name: Check front formatting
        run: pnpm format

      - name: Build front
        run: pnpm --filter front build

      - name: Verify front production build emits a CSS asset
        run: node apps/front/scripts/guards/verify-build-css-link.mts

      - name: Verify front production font bundle references and unicode coverage
        run: node apps/front/scripts/guards/verify-font-bundle.mts --dist apps/front/dist --locales-dir apps/front/src/i18n/locales

      - name: Smoke start front server and verify stylesheet tag
        env:
          PUBLIC_API_BASE_URL: 'http://127.0.0.1:5000'
          SERVER_API_BASE_URL: 'http://127.0.0.1:5000'
        run: |
          pnpm --filter front start > /tmp/front-ci-server.log 2>&1 &
          FRONT_SERVER_PID=$!
          trap 'kill $FRONT_SERVER_PID || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/front-home.html; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:3000/ > /tmp/front-home.html; then
            echo "front standalone server failed to return HTML from /"
            cat /tmp/front-ci-server.log
            exit 1
          fi

          if ! grep -aEq 'rel="stylesheet"[^>]*href="[^"]+\.css"' /tmp/front-home.html; then
            echo "front production HTML does not contain stylesheet link"
            cat /tmp/front-home.html
            exit 1
          fi

      - name: Typecheck front
        run: pnpm --filter front typecheck

      - name: Lint front
        run: |
          node packages/scripts-ts/src/lint-front.ts --quiet
          node packages/scripts-ts/src/check-no-floating-promises.ts
          pnpm lint:disables
          pnpm check:frontend-barrels

      - name: Check front design system
        run: pnpm --filter front check:design-system

      # #1234: built-artifact guard — asserts on the dist emitted by the
      # "Build front" step above that the React Compiler actually ran (its
      # runtime chunk is present and the compiled-module count is at or
      # above a pinned floor). Without this, flipping vite.config.ts to a
      # compilation mode that compiles nothing keeps every other gate green.
      - name: Check front React Compiler artifacts
        run: pnpm --filter front check:react-compiler

      # Round 19 I3: the drawer-description contrast guard is the ONLY
      # browser-launching test in the front unit suite. It no longer runs in
      # this lane — the ordinary suite is browser-free, so no unit-lane
      # contributor or CI run must provision Chromium for a synthetic guard
      # the live e2e already bounds. The guard runs in the e2e lane
      # (front-e2e.yml, once-only shard-4 block), which already installs the
      # same Chromium and gates the real drawer spec.
      - name: Test front
        run: pnpm --filter front test

      # Paired red-proof tests (issue #1659). These tests are EXPECTED TO FAIL —
      # each proves a bug by failing against the corrected code. The runner
      # script (scripts/ci/run-preuves.mts) inverts the semantics: a test that
      # fails is a pass, and a test that passes is a failure (the bug has changed
      # form or been fixed, making the proof stale).
      #
      # Option (b) of issue #1659 ronde 5: the step is scoped to PRs that
      # DECLARE a paired red proof. A PR declares one by adding or modifying a
      # proof test file under apps/front/tests/proofs/<issue>/. Proof files are
      # versionned (committed to the repo), so CI can always see them — unlike
      # .dump/, which is git-ignored and absent on a clean CI checkout. The
      # runner uses `git diff` to detect whether the current PR touched any
      # proof files:
      #
      # - If proofs were declared: replay them with inverted semantics. A proof
      #   test that fails as expected → step passes. A proof test that passes
      #   unexpectedly → step fails (the bug changed form or was fixed; the
      #   proof is stale and must be rebuilt).
      # - If no proofs were declared: the step prints an explicit "no proofs
      #   declared" message and exits 0. This is NOT a silent green — it states
      #   exactly what was checked and why the step did not run. PRs that do not
      #   claim a paired red proof are out of scope.
      #
      # The developer replay path is the lane worktree (`just test-preuves`),
      # where .dump/ also exists for trace artifacts.
      - name: Verify paired red proofs
        run: pnpm --filter front test:preuves
        # Mirrors `just test-preuves` in the local ci-front recipe.

  # IMPORTANT fix: the four #1017 aggregate-gate test suites and the
  # packages/scripts-ts/src/check-ci-gate-structure.ts CLI were reachable only through local
  # `just ci-drift` — no workflow invoked them. A review confirmed against a
  # real job log that server CI ran lint/design-system/front tests but none
  # of the gate guard's own tests, so every guard #1017 added was, on the
  # server, unenforced: local policy is not enforcement. This job runs the
  # exact same commands `just ci-drift` runs, server-side, gated by the same
  # relevance classifier above (widened to also cover the other three gate
  # workflow files — see the "Check whether front-ci paths changed" step's
  # comment), and folded into front-ci-gate below so it cannot silently stop
  # being required without also failing packages/scripts-ts/src/check-ci-gate-structure.ts's
  # "gate.needs must equal every other job in the file" check.
  gate-selftest:
    name: CI gate guard self-test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install (frozen lockfile, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run CI gate guard tests (mirrors `just ci-drift`)
        env:
          # The actions-pins live scan (`node ./packages/scripts-ts/src/check-actions-pins.ts`
          # below) resolves each pinned action tag through `gh api`. Without a
          # token in this job, GitHub rejects those anonymous lookups and the
          # guard fails loud ("cannot certify pins without tag data") — which
          # is correct behaviour, wired wrong. The default token can read the
          # public actions/* repos' tags; no elevated scope is needed, matching
          # quality-gate.yml's own pins-guard step.
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --filter scripts-ts exec vitest run src/codeowners-contract.test.ts
          pnpm --filter scripts-ts exec vitest run src/check-ci-drift.test.ts
          pnpm --filter scripts-ts exec vitest run src/lint-front.test.ts
          pnpm --filter scripts-ts exec vitest run src/check-no-floating-promises.test.ts
          node ./packages/scripts-ts/src/check-ci-drift.ts
          pnpm --filter scripts-ts exec vitest run src/ci-changed-paths.test.ts
          pnpm --filter scripts-ts exec vitest run src/ci-gate-bootstrap.test.ts
          pnpm --filter scripts-ts exec vitest run src/ci-gate-aggregation.test.ts
          pnpm --filter scripts-ts exec vitest run src/ci-e2e-rerun-guard.test.ts
          pnpm --filter scripts-ts exec vitest run src/check-ci-gate-structure.test.ts
          node ./packages/scripts-ts/src/check-ci-gate-structure.ts
          pnpm --filter scripts-ts exec vitest run src/require-linked-issue.test.ts
          pnpm --filter scripts-ts exec vitest run src/check-actions-pinned.test.ts
          node ./packages/scripts-ts/src/check-actions-pinned.ts
          pnpm --filter scripts-ts exec vitest run src/check-actions-pins.test.ts
          node ./packages/scripts-ts/src/check-actions-pins.ts
          pnpm --filter scripts-ts exec vitest run src/ci-referenced-paths.test.ts
          pnpm --filter scripts-ts exec vitest run src/check-cyclomatic-bound.test.ts
          node ./packages/scripts-ts/src/check-cyclomatic-bound.ts
          # #1674: bite-proof test for the production-dependency audit
          # gate. Runs the real pnpm audit on a controlled fixture
          # carrying a known-stable moderate advisory (ejs@3.1.7 →
          # GHSA-ghr5-ch3p-vcr6) so the gate's threshold regression
          # (e.g. reverting to `--audit-level=high`) is caught before
          # the audit step itself runs.
          pnpm --filter scripts-ts exec vitest run src/prod-audit-bites.test.ts

      # This must run in a required-check dependency, not only locally: the
      # projection protects closure evidence and Trello delivery-card updates.
      - name: Run project closure adapter tests
        run: pnpm test:project-closure-adapter

  # Required status check: this is the one context that should be required
  # on the branch ruleset instead of relying on the trigger. It always
  # reports (if: always()), passes when upstream jobs succeeded or were
  # skipped (irrelevant PR), and fails on any real failure or cancellation
  # rather than treating either as "not applicable".
  gate:
    # BLOCKER fix (round 5, corrected): an event-guarded `if:` alone left
    # this job SKIPPED (not absent) on a push-triggered run, and GitHub
    # still creates and reports a check run named "front-ci-gate" for a
    # skipped job -- just with conclusion "skipped" instead of a real
    # pass/fail. Verified live: PR #1029's own head commit still carried
    # TWO "front-ci-gate" check runs for the same SHA (one "success",
    # one "skipped"), which is the same "one required context, two
    # reports, last one wins" nondeterminism this fix exists to remove --
    # it had only changed what the second report said, not whether it
    # existed. Fixed instead by renaming: `name:` is now conditional on
    # the event, so a run triggered by anything other than a pull request
    # or a merge-queue entry reports under a DIFFERENT, non-required
    # context ("front-ci-push-check") that can never collide with
    # "front-ci-gate". `if:` goes back to unconditional `always()` so
    # the push-triggered run still aggregates and reports a REAL pass/fail
    # (useful direct-push/post-merge validation) instead of an
    # uninformative skip.
    #
    # Round 6 BLOCKER: the condition is an ALLOWLIST, not `!= 'push'`. The
    # earlier `github.event_name == 'push' && ... || ...` form resolved to
    # the REQUIRED name for every event that was not `push`, so simply
    # adding `workflow_dispatch:` to this workflow's `on:` produced a
    # second reporter of "front-ci-gate" for the same commit -- a manual run
    # takes a branch/tag ref and uses its last commit as GITHUB_SHA -- and
    # both enforced guards stayed green. Only `pull_request` and
    # `merge_group` may resolve to the required name.
    # packages/scripts-ts/src/check-ci-gate-structure.ts pins this exact expression, caps
    # this workflow's `on:` to pull_request/merge_group/push, and scans
    # every job in every workflow in the repository so no other job can
    # report one of the four required names either.
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'front-ci-gate' || 'front-ci-push-check' }}
    if: always()
    needs: [changes, supply-chain, gate-selftest]
    runs-on: ubuntu-latest
    steps:
      # BLOCKER fix (round 5): `gate-selftest` above runs
      # packages/scripts-ts/src/check-ci-gate-structure.ts (among other things) server-side,
      # but only as long as it stays connected to THIS job's `needs:` — a
      # review round proved that dropping `gate-selftest` from `needs` makes
      # the selftest job itself go red, but disconnects it from
      # `front-ci-gate`, which stayed green: the decisive "gate.needs must
      # equal every other job in the file" check inside
      # check-ci-gate-structure.mjs was only ever invoked from a job that
      # could itself be the thing removed from `needs`. This step runs that
      # exact same script again, but as one of THIS job's own steps — the one
      # externally required context — so it cannot be silently disconnected
      # the way a whole job can. Only a direct edit to this job's own steps
      # could remove it, which is the accepted #1022 malicious-author gap
      # (a pull request can rewrite its own merge-commit YAML arbitrarily),
      # not the accidental-disconnection gap this closes. Since this script
      # parses all four #1017 gate workflow files, it also re-derives (from
      # inside the one required context that cannot be conditionally
      # disconnected) that front-e2e.yml, openapi-spec-drift.yml, and
      # docs-archive.yml's own gate.needs are each still complete.
      #
      # Gated on `relevant` like this job's siblings: any edit capable of
      # tripping this check is necessarily an edit to one of the four gate
      # workflow files, which the classifier above (widened to cover all
      # four, pinned by check-ci-gate-structure.mjs's selfTestCoverage check)
      # always classifies relevant=true for.
      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        if: needs.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Setup Node
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install (frozen lockfile, no scripts)
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the aggregate-gate job graph from inside the required job itself
        if: needs.changes.outputs.relevant == 'true'
        run: node ./packages/scripts-ts/src/check-ci-gate-structure.ts

      # Reads the `needs` context directly (via toJSON) instead of a
      # hand-written per-job map: a job added to `needs` above without also
      # being added to a hand-maintained Bash list would silently never be
      # checked (round-2 review). `needs` is populated by Actions from this
      # job's own `needs:` keyword, so there is no second list to omit an
      # entry from.
      - name: Check required jobs
        id: check-required-jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # Fail closed on anything outside the exact documented shape: a
        # nonempty JSON object whose every entry's result is exactly
        # "success" or "skipped" (GitHub documents only
        # success/failure/cancelled/skipped for needs.<job>.result — see
        # packages/scripts-ts/src/ci-gate-aggregation.test.ts). An empty object/array, a
        # missing `.result`, or an unrecognized result value (a documented
        # future addition, a typo, a job whose result GitHub reports in a
        # shape this was not written against) must never silently pass
        # "nothing to flag" — and neither may examining zero jobs.
        #
        # BLOCKER fix: treating every "skipped" result as a pass — the
        # original shape of this check — let a review round prove `changes`
        # succeeding with an absent/empty `relevant` output plus every heavy
        # job skipped as green: skipped work was never correlated with the
        # classifier's own answer, so "skipped" was accepted as proof of
        # nothing. This step now also asserts `needs.changes.result ==
        # "success"`, requires `needs.changes.outputs.relevant` to be
        # EXACTLY the string "true" or "false" (GitHub can omit a job output
        # entirely — including because it may contain a secret — so an
        # absent/empty/malformed value fails closed rather than being read as
        # a green light), and only allows a required job to be "skipped" when
        # relevant is exactly "false". When relevant is "true", every
        # required job (including one whose skip was actually caused by an
        # upstream failure cascading a default skip) must be "success".
        run: |
          if [ "$(echo "$NEEDS_JSON" | jq -r 'type')" != "object" ]; then
            echo "::error::NEEDS_JSON is not a JSON object — examining nothing must never pass."
            exit 1
          fi

          if [ "$(echo "$NEEDS_JSON" | jq 'length')" -eq 0 ]; then
            echo "::error::NEEDS_JSON has no entries — examining zero jobs must never pass."
            exit 1
          fi

          echo "Required jobs and their results:"
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          changes_result="$(echo "$NEEDS_JSON" | jq -r '.changes.result // "MISSING"')"

          if [ "$changes_result" != "success" ]; then
            echo "::error::needs.changes.result must be exactly \"success\" (found: \"$changes_result\"). Nothing downstream can be trusted if the changed-paths classifier itself did not run to completion."
            exit 1
          fi

          relevant="$(echo "$NEEDS_JSON" | jq -r '.changes.outputs.relevant // "MISSING"')"

          if [ "$relevant" != "true" ] && [ "$relevant" != "false" ]; then
            echo "::error::needs.changes.outputs.relevant must be exactly the string \"true\" or \"false\" (found: \"$relevant\"). GitHub can omit a job output entirely — including because it may contain a secret — so an absent, empty, or otherwise malformed relevance signal must never be treated as license to accept skipped verification work."
            exit 1
          fi

          if [ "$relevant" = "true" ]; then
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select(.result != "success")] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::The changes classifier reported this change as relevant, so every required job must have actually run and succeeded (skipped is not acceptable) — but one or more did not (see results above)."
              exit 1
            fi
          else
            bad_count="$(echo "$NEEDS_JSON" | jq '[.[] | select((.result == "success" or .result == "skipped") | not)] | length')"

            if [ "$bad_count" -gt 0 ]; then
              echo "::error::One or more required jobs did not report success or skipped (failure, cancelled, or an unrecognized result value)."
              exit 1
            fi
          fi

          echo "All required jobs passed, or were correctly skipped for a verified-irrelevant change."

      # BLOCKER fix (round 5): `continue-on-error: true` added to the step
      # above would make its reported CONCLUSION "success" even after it
      # printed `::error::` and exited 1 — masking a correctly-detected
      # aggregation failure the same way it masks a verification step's
      # failure. GitHub computes a step's `outcome` BEFORE continue-on-error
      # is applied (only `conclusion` is rewritten afterward), so reading
      # `steps.check-required-jobs.outcome` here is not fooled by
      # continue-on-error on that step. `if: always()` so this still runs
      # (and still fails the job) even if the step above failed for real
      # without continue-on-error. packages/scripts-ts/src/check-ci-gate-structure.ts
      # separately hard-rejects continue-on-error anywhere in this job, as
      # an independent second layer.
      - name: Verify the required-jobs check truly succeeded (continue-on-error cannot mask this)
        if: always()
        run: |
          outcome="${{ steps.check-required-jobs.outcome }}"

          if [ "$outcome" != "success" ]; then
            echo "::error::steps.check-required-jobs.outcome was \"$outcome\", not \"success\". continue-on-error can rewrite a step's CONCLUSION but not its OUTCOME, so a masked required-jobs check failure is still caught here."
            exit 1
          fi
