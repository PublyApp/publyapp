# Dokploy Configuration for PDF Vite App
# Set environment variables in Dokploy GUI

services:
  publyapp-api:
    # Immutable release tag, never :latest (design §3.4, F14): a mixed-version fleet must
    # be an explicit, inspectable state, not an accident of pull timing.
    image: ghcr.io/publyapp/publyapp/api:${RELEASE_TAG}
    restart: unless-stopped
    # > host ShutdownTimeout (30 s) so graceful drain wins over SIGKILL (design §3.6, F19).
    stop_grace_period: 45s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      # This container runs ONLY the HTTP surface; the job engine runs in
      # publyapp-worker below (design §3.2/§3.4).
      - APP_ROLE=api
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING};MaxPoolSize=50
      - FRONT_URL=${FRONT_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STAFF_OWNER_EMAIL=${STAFF_OWNER_EMAIL}
      - STAFF_OWNER_BOOTSTRAP_CODE=${STAFF_OWNER_BOOTSTRAP_CODE}
      - APP_NAME=${APP_NAME}
      - DEFAULT_EMAIL_SENDER_EMAIL=${DEFAULT_EMAIL_SENDER_EMAIL}
      - DEFAULT_EMAIL_SENDER_NAME=${DEFAULT_EMAIL_SENDER_NAME}
      - SESSION_TOKEN_HEADER_KEY=${SESSION_TOKEN_HEADER_KEY}
      - TENANT_ID_HEADER_KEY=${TENANT_ID_HEADER_KEY}
      - SESSION_EXPIRY_DAYS=${SESSION_EXPIRY_DAYS}
      - EMAIL_VERIFY_TOKEN_VALIDITY_DURATION=${EMAIL_VERIFY_TOKEN_VALIDITY_DURATION}
      - PASSWORD_RESET_TOKEN_VALIDITY_DURATION=${PASSWORD_RESET_TOKEN_VALIDITY_DURATION}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH}
      - EMAIL_VERIFY_TOKEN_LENGTH=${EMAIL_VERIFY_TOKEN_LENGTH}
      - PASSWORD_RESET_TOKEN_LENGTH=${PASSWORD_RESET_TOKEN_LENGTH}
      - INVITATION_TOKEN_LENGTH=${INVITATION_TOKEN_LENGTH}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}
      - ANON_AUTH_IP_RATE_LIMIT_PERMIT_LIMIT=${ANON_AUTH_IP_RATE_LIMIT_PERMIT_LIMIT}
      - ANON_AUTH_IP_RATE_LIMIT_WINDOW_SECONDS=${ANON_AUTH_IP_RATE_LIMIT_WINDOW_SECONDS}
      - ANON_AUTH_EMAIL_RATE_LIMIT_PERMIT_LIMIT=${ANON_AUTH_EMAIL_RATE_LIMIT_PERMIT_LIMIT}
      - ANON_AUTH_EMAIL_RATE_LIMIT_WINDOW_SECONDS=${ANON_AUTH_EMAIL_RATE_LIMIT_WINDOW_SECONDS}
      - PASSWORD_RESET_EMAIL_RATE_LIMIT_PERMIT_LIMIT=${PASSWORD_RESET_EMAIL_RATE_LIMIT_PERMIT_LIMIT}
      - PASSWORD_RESET_EMAIL_RATE_LIMIT_WINDOW_SECONDS=${PASSWORD_RESET_EMAIL_RATE_LIMIT_WINDOW_SECONDS}
      - GLOBAL_RATE_LIMIT_PERMIT_LIMIT=${GLOBAL_RATE_LIMIT_PERMIT_LIMIT}
      - GLOBAL_RATE_LIMIT_WINDOW_SECONDS=${GLOBAL_RATE_LIMIT_WINDOW_SECONDS}
      - ANONYMOUS_OTHER_RATE_LIMIT_PERMIT_LIMIT=${ANONYMOUS_OTHER_RATE_LIMIT_PERMIT_LIMIT}
      - ANONYMOUS_OTHER_RATE_LIMIT_WINDOW_SECONDS=${ANONYMOUS_OTHER_RATE_LIMIT_WINDOW_SECONDS}
      - AUTHENTICATED_RATE_LIMIT_PERMIT_LIMIT=${AUTHENTICATED_RATE_LIMIT_PERMIT_LIMIT}
      - AUTHENTICATED_RATE_LIMIT_WINDOW_SECONDS=${AUTHENTICATED_RATE_LIMIT_WINDOW_SECONDS}
      - HEAVY_SEARCH_RATE_LIMIT_PERMIT_LIMIT=${HEAVY_SEARCH_RATE_LIMIT_PERMIT_LIMIT}
      - HEAVY_SEARCH_RATE_LIMIT_WINDOW_SECONDS=${HEAVY_SEARCH_RATE_LIMIT_WINDOW_SECONDS}
      - BULK_RATE_LIMIT_PERMIT_LIMIT=${BULK_RATE_LIMIT_PERMIT_LIMIT}
      - BULK_RATE_LIMIT_WINDOW_SECONDS=${BULK_RATE_LIMIT_WINDOW_SECONDS}
      - TENANT_BULK_RATE_LIMIT_PERMIT_LIMIT=${TENANT_BULK_RATE_LIMIT_PERMIT_LIMIT}
      - TENANT_BULK_RATE_LIMIT_WINDOW_SECONDS=${TENANT_BULK_RATE_LIMIT_WINDOW_SECONDS}
      - EMAIL_RATE_LIMIT_PERMIT_LIMIT=${EMAIL_RATE_LIMIT_PERMIT_LIMIT}
      - EMAIL_RATE_LIMIT_WINDOW_SECONDS=${EMAIL_RATE_LIMIT_WINDOW_SECONDS}
      - TENANT_EMAIL_RATE_LIMIT_PERMIT_LIMIT=${TENANT_EMAIL_RATE_LIMIT_PERMIT_LIMIT}
      - TENANT_EMAIL_RATE_LIMIT_WINDOW_SECONDS=${TENANT_EMAIL_RATE_LIMIT_WINDOW_SECONDS}
      - EXPORT_RATE_LIMIT_PERMIT_LIMIT=${EXPORT_RATE_LIMIT_PERMIT_LIMIT}
      - EXPORT_RATE_LIMIT_WINDOW_SECONDS=${EXPORT_RATE_LIMIT_WINDOW_SECONDS}
      - TENANT_EXPORT_RATE_LIMIT_PERMIT_LIMIT=${TENANT_EXPORT_RATE_LIMIT_PERMIT_LIMIT}
      - TENANT_EXPORT_RATE_LIMIT_WINDOW_SECONDS=${TENANT_EXPORT_RATE_LIMIT_WINDOW_SECONDS}
      - UPLOAD_RATE_LIMIT_PERMIT_LIMIT=${UPLOAD_RATE_LIMIT_PERMIT_LIMIT}
      - UPLOAD_RATE_LIMIT_WINDOW_SECONDS=${UPLOAD_RATE_LIMIT_WINDOW_SECONDS}
      # Distributed counter budget (#953): default postgres keeps N replicas on one
      # fleet-wide budget per partition; memory is the single-replica incident lever.
      - RATE_LIMIT_COUNTER_STORE=${RATE_LIMIT_COUNTER_STORE:-postgres}
      - DI_MANIFEST_ENABLED=${DI_MANIFEST_ENABLED}
      - AUDIT_LOG_EXPORT_MAX_ROWS=${AUDIT_LOG_EXPORT_MAX_ROWS}
      - MAX_PROFILES_PER_USER=${MAX_PROFILES_PER_USER}
      - TENANT_USER_EXPORT_MAX_ROWS=${TENANT_USER_EXPORT_MAX_ROWS}
      - TENANT_ACTIVITY_THROTTLE_MINUTES=${TENANT_ACTIVITY_THROTTLE_MINUTES}
      - FILE_STORAGE_ROOT=${FILE_STORAGE_ROOT}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES}
      - JOB_QUEUE_BATCH_SIZE=${JOB_QUEUE_BATCH_SIZE}
      - JOB_QUEUE_POLL_SECONDS=${JOB_QUEUE_POLL_SECONDS}
      - JOB_LEASE_SECONDS=${JOB_LEASE_SECONDS}
      - JOB_QUEUE_DRAIN_BUDGET_SECONDS=${JOB_QUEUE_DRAIN_BUDGET_SECONDS}
      - EMAIL_LOG_RETENTION_DAYS=${EMAIL_LOG_RETENTION_DAYS}
      - JOB_DEAD_LETTER_RETENTION_DAYS=${JOB_DEAD_LETTER_RETENTION_DAYS}
      - EMAIL_PREPARED_SEND_RETENTION_DAYS=${EMAIL_PREPARED_SEND_RETENTION_DAYS}
      - EMAIL_PREPARED_SWEEP_MAX_LAG_MINUTES=${EMAIL_PREPARED_SWEEP_MAX_LAG_MINUTES}
      - SYSTEM_JOB_OCCURRENCE_RETENTION_DAYS=${SYSTEM_JOB_OCCURRENCE_RETENTION_DAYS}
      - JOB_ALERT_LEASE_RETENTION_DAYS=${JOB_ALERT_LEASE_RETENTION_DAYS}
      - JOB_REGISTRY_DLQ_ORPHAN_ALLOWLIST=${JOB_REGISTRY_DLQ_ORPHAN_ALLOWLIST}
      - SOCIAL_ACCOUNTS_MASTER_KEY=${SOCIAL_ACCOUNTS_MASTER_KEY}
    # Persists staff-uploaded assets (tenant logos) at FILE_STORAGE_ROOT across
    # redeploys/container replacement — without this, every deploy wipes
    # .artifacts/storage and every /files/... URL in tenants.logo_url 404s.
    # The mount must be writable by the container's $APP_UID (see
    # apps/api/Dockerfile, which chowns .artifacts to $APP_UID at build time).
    volumes:
      - publyapp-api-storage:/app/.artifacts/storage
    networks:
      - dokploy-network
    # HTTP routing (domain -> this service on :5000, HTTPS) is configured in Dokploy's
    # Domains tab, NOT via compose labels. Dokploy translates a Domains-tab record into the
    # raw traefik.* labels + traefik.docker.network=dokploy-network that Traefik actually
    # reads; hand-written dokploy.* labels are not a supported abstraction and were removed
    # so this file never looks like it wires routing when it does not. See the deploy runbook.
    healthcheck:
      # Readiness gates routing. The five-minute start period matches the migration gate
      # budget, so pending migrations keep the API alive-but-unrouted throughout the start
      # period: plain Compose does not kill an unhealthy container, so the healthcheck failing
      # during the wait does not take the container down (Traefik simply withholds routing).
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:5000/health/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s

  # Same GHCR image as publyapp-api, differing only by env: this container runs the
  # background job engine (queue processor, scheduler leader + Quartz, outbox
  # dispatchers) and serves NO HTTP (design §3.2/§3.4/§3.5).
  publyapp-worker:
    image: ghcr.io/publyapp/publyapp/api:${RELEASE_TAG} # same image as api, immutable tag (F14)
    restart: unless-stopped
    # Above the ~30 s Quartz-drain / graceful-shutdown budget (HostOptions.ShutdownTimeout,
    # design §3.6); Compose's 10 s default would SIGKILL mid-drain (audit F19).
    stop_grace_period: 45s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_ENVIRONMENT=Production
      - APP_ROLE=worker
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING};MaxPoolSize=30
      - FRONT_URL=${FRONT_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STAFF_OWNER_EMAIL=${STAFF_OWNER_EMAIL}
      - STAFF_OWNER_BOOTSTRAP_CODE=${STAFF_OWNER_BOOTSTRAP_CODE}
      - APP_NAME=${APP_NAME}
      - DEFAULT_EMAIL_SENDER_EMAIL=${DEFAULT_EMAIL_SENDER_EMAIL}
      - DEFAULT_EMAIL_SENDER_NAME=${DEFAULT_EMAIL_SENDER_NAME}
      - SESSION_TOKEN_HEADER_KEY=${SESSION_TOKEN_HEADER_KEY}
      - TENANT_ID_HEADER_KEY=${TENANT_ID_HEADER_KEY}
      - SESSION_EXPIRY_DAYS=${SESSION_EXPIRY_DAYS}
      - EMAIL_VERIFY_TOKEN_VALIDITY_DURATION=${EMAIL_VERIFY_TOKEN_VALIDITY_DURATION}
      - PASSWORD_RESET_TOKEN_VALIDITY_DURATION=${PASSWORD_RESET_TOKEN_VALIDITY_DURATION}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH}
      - EMAIL_VERIFY_TOKEN_LENGTH=${EMAIL_VERIFY_TOKEN_LENGTH}
      - PASSWORD_RESET_TOKEN_LENGTH=${PASSWORD_RESET_TOKEN_LENGTH}
      - INVITATION_TOKEN_LENGTH=${INVITATION_TOKEN_LENGTH}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}
      - DI_MANIFEST_ENABLED=${DI_MANIFEST_ENABLED}
      - AUDIT_LOG_EXPORT_MAX_ROWS=${AUDIT_LOG_EXPORT_MAX_ROWS}
      - MAX_PROFILES_PER_USER=${MAX_PROFILES_PER_USER}
      - TENANT_USER_EXPORT_MAX_ROWS=${TENANT_USER_EXPORT_MAX_ROWS}
      - TENANT_ACTIVITY_THROTTLE_MINUTES=${TENANT_ACTIVITY_THROTTLE_MINUTES}
      - FILE_STORAGE_ROOT=${FILE_STORAGE_ROOT}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES}
      - JOB_QUEUE_BATCH_SIZE=${JOB_QUEUE_BATCH_SIZE}
      - JOB_QUEUE_POLL_SECONDS=${JOB_QUEUE_POLL_SECONDS}
      - JOB_LEASE_SECONDS=${JOB_LEASE_SECONDS}
      - JOB_QUEUE_DRAIN_BUDGET_SECONDS=${JOB_QUEUE_DRAIN_BUDGET_SECONDS}
      - EMAIL_LOG_RETENTION_DAYS=${EMAIL_LOG_RETENTION_DAYS}
      - JOB_DEAD_LETTER_RETENTION_DAYS=${JOB_DEAD_LETTER_RETENTION_DAYS}
      - EMAIL_PREPARED_SEND_RETENTION_DAYS=${EMAIL_PREPARED_SEND_RETENTION_DAYS}
      - EMAIL_PREPARED_SWEEP_MAX_LAG_MINUTES=${EMAIL_PREPARED_SWEEP_MAX_LAG_MINUTES}
      - SYSTEM_JOB_OCCURRENCE_RETENTION_DAYS=${SYSTEM_JOB_OCCURRENCE_RETENTION_DAYS}
      - JOB_ALERT_LEASE_RETENTION_DAYS=${JOB_ALERT_LEASE_RETENTION_DAYS}
      - JOB_REGISTRY_DLQ_ORPHAN_ALLOWLIST=${JOB_REGISTRY_DLQ_ORPHAN_ALLOWLIST}
      - SOCIAL_ACCOUNTS_MASTER_KEY=${SOCIAL_ACCOUNTS_MASTER_KEY}
    # Shares the api's storage volume so files written by future export jobs (#213/#286)
    # are visible to the api's /files static serving (audit F18) — same FILE_STORAGE_ROOT
    # path in both roles.
    volumes:
      - publyapp-api-storage:/app/.artifacts/storage
    networks:
      - dokploy-network
    # NO dokploy.domain / dokploy.port labels — the worker serves no HTTP surface.
    # Liveness is the in-image file-heartbeat probe (design §3.5, ratified O3): exits 0
    # when the migration gate or post-startup heartbeat service has kept the file fresh.
    healthcheck:
      test: ['CMD', 'dotnet', 'PublyApp.Api.dll', '--worker-health']
      interval: 30s
      timeout: 10s
      retries: 3
      # Belt-and-suspenders grace matching the worker migration-gate timeout.
      start_period: 300s

  # A one-shot Compose container, not a long-running service or a Compose profile/dependency.
  # It runs once per deploy to apply the EF migration bundle, then exits (zero or non-zero)
  # and stays exited; the no-restart controls below keep it from running again. Because this
  # file declares no `depends_on`, it starts concurrently with api and worker, which gate their
  # own readiness against it (see the worker startup gate and the API readiness probe).
  publyapp-migrate:
    image: ghcr.io/publyapp/publyapp/migrate:${RELEASE_TAG}
    # One-shot: run once per deploy, never restart. `restart: "no"` governs under plain
    # `docker compose` (the Compose mode recorded on this instance); `deploy.restart_policy`
    # below is the Compose deploy-spec equivalent, which Compose honors when present and falls
    # back to `restart:` only when absent. Both are set so the one-shot holds whatever Dokploy
    # compose type is selected (Swarm/Stack is NOT in use here; it remains only a documented
    # contingency for true zero-downtime cutover, per the deployment design doc).
    restart: 'no'
    deploy:
      restart_policy:
        condition: none
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_ENVIRONMENT=Production
      - APP_ROLE=api
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING};MaxPoolSize=50
      - FRONT_URL=${FRONT_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STAFF_OWNER_EMAIL=${STAFF_OWNER_EMAIL}
      - STAFF_OWNER_BOOTSTRAP_CODE=${STAFF_OWNER_BOOTSTRAP_CODE}
      - APP_NAME=${APP_NAME}
      - DEFAULT_EMAIL_SENDER_EMAIL=${DEFAULT_EMAIL_SENDER_EMAIL}
      - DEFAULT_EMAIL_SENDER_NAME=${DEFAULT_EMAIL_SENDER_NAME}
      - SESSION_TOKEN_HEADER_KEY=${SESSION_TOKEN_HEADER_KEY}
      - TENANT_ID_HEADER_KEY=${TENANT_ID_HEADER_KEY}
      - SESSION_EXPIRY_DAYS=${SESSION_EXPIRY_DAYS}
      - EMAIL_VERIFY_TOKEN_VALIDITY_DURATION=${EMAIL_VERIFY_TOKEN_VALIDITY_DURATION}
      - PASSWORD_RESET_TOKEN_VALIDITY_DURATION=${PASSWORD_RESET_TOKEN_VALIDITY_DURATION}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH}
      - EMAIL_VERIFY_TOKEN_LENGTH=${EMAIL_VERIFY_TOKEN_LENGTH}
      - PASSWORD_RESET_TOKEN_LENGTH=${PASSWORD_RESET_TOKEN_LENGTH}
      - INVITATION_TOKEN_LENGTH=${INVITATION_TOKEN_LENGTH}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}
      - DI_MANIFEST_ENABLED=${DI_MANIFEST_ENABLED}
      - AUDIT_LOG_EXPORT_MAX_ROWS=${AUDIT_LOG_EXPORT_MAX_ROWS}
      - MAX_PROFILES_PER_USER=${MAX_PROFILES_PER_USER}
      - TENANT_USER_EXPORT_MAX_ROWS=${TENANT_USER_EXPORT_MAX_ROWS}
      - TENANT_ACTIVITY_THROTTLE_MINUTES=${TENANT_ACTIVITY_THROTTLE_MINUTES}
      - FILE_STORAGE_ROOT=${FILE_STORAGE_ROOT}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES}
      - JOB_QUEUE_BATCH_SIZE=${JOB_QUEUE_BATCH_SIZE}
      - JOB_QUEUE_POLL_SECONDS=${JOB_QUEUE_POLL_SECONDS}
      - JOB_LEASE_SECONDS=${JOB_LEASE_SECONDS}
      - JOB_QUEUE_DRAIN_BUDGET_SECONDS=${JOB_QUEUE_DRAIN_BUDGET_SECONDS}
      - EMAIL_LOG_RETENTION_DAYS=${EMAIL_LOG_RETENTION_DAYS}
      - JOB_DEAD_LETTER_RETENTION_DAYS=${JOB_DEAD_LETTER_RETENTION_DAYS}
      - EMAIL_PREPARED_SEND_RETENTION_DAYS=${EMAIL_PREPARED_SEND_RETENTION_DAYS}
      - EMAIL_PREPARED_SWEEP_MAX_LAG_MINUTES=${EMAIL_PREPARED_SWEEP_MAX_LAG_MINUTES}
      - SYSTEM_JOB_OCCURRENCE_RETENTION_DAYS=${SYSTEM_JOB_OCCURRENCE_RETENTION_DAYS}
      - JOB_ALERT_LEASE_RETENTION_DAYS=${JOB_ALERT_LEASE_RETENTION_DAYS}
      - JOB_REGISTRY_DLQ_ORPHAN_ALLOWLIST=${JOB_REGISTRY_DLQ_ORPHAN_ALLOWLIST}
      - SOCIAL_ACCOUNTS_MASTER_KEY=${SOCIAL_ACCOUNTS_MASTER_KEY}
    networks:
      - dokploy-network

  publyapp-front:
    image: ghcr.io/publyapp/publyapp/front:${RELEASE_TAG}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}
      - SERVER_API_BASE_URL=${SERVER_API_BASE_URL}
      - VITE_ASP_SERVER_URL=${VITE_ASP_SERVER_URL}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      - PUBLIC_POSTHOG_PROJECT_TOKEN=${PUBLIC_POSTHOG_PROJECT_TOKEN}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}
    networks:
      - dokploy-network
    # HTTP routing (domains -> this service on :3000, HTTPS) is configured in Dokploy's
    # Domains tab, NOT via compose labels (same rationale as publyapp-api above).
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:''+(process.env.PORT||3000)+''/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  # Dokploy's shared network is the ONLY network these services need. It lets api/worker/migrate
  # reach a Dokploy-managed PostgreSQL by its service name and lets Traefik route to the api/front.
  # Do NOT put this shared subnet in TRUSTED_PROXY_CIDRS: peer containers could forge XFF.
  # Trust Traefik's exact /32 or /128 address(es), or provision a proxy-only network joined by
  # Traefik and the API and trust only that network's CIDR.
  # A separate private bridge was removed as redundant: the DB is reached via connection string,
  # api<->worker share state through a named volume, and front reaches api by its configured URL —
  # nothing needs an extra internal network, and a single network removes all Traefik
  # multi-network routing ambiguity. Must already exist (created by Dokploy); joined as external.
  dokploy-network:
    external: true

volumes:
  publyapp-api-storage:
