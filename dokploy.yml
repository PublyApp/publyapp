# Dokploy Configuration for PDF Vite App
# Set environment variables in Dokploy GUI

services:
  publyapp-api:
    image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/api:latest
    container_name: publyapp-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - POSTGRES_CONNECTION_STRING=${POSTGRES_CONNECTION_STRING}
      - FRONT_URL=${FRONT_URL}
    ports:
      - "5000:5000"
    networks:
      - publyapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  publyapp-front:
    image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME/front:latest
    container_name: publyapp-front
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_ASP_SERVER_URL=${VITE_ASP_SERVER_URL}
      - VITE_POSTHOG_API_KEY=${VITE_POSTHOG_API_KEY}
    ports:
      - "3000:3000"
    networks:
      - publyapp-network
    depends_on:
      - publyapp-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  publyapp-network:
    driver: bridge
