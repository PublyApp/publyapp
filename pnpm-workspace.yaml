packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: true

# One exact version per dependency used by two or more workspaces (#2326).
# Workspaces reference these as "<name>": "catalog:" instead of repeating a
# specifier. A dependency used by a single workspace stays in that manifest.
catalog:
  "@microsoft/kiota-abstractions": 1.0.0-preview.111
  "@microsoft/kiota-serialization-json": 1.0.0-preview.111
  "@types/node": 24.19.2
  i18next: 26.6.0
  oxlint: 1.90.0
  ts-morph: 28.0.0
  typescript: 7.0.2
  vitest: 4.1.12
  zod: 4.6.7

