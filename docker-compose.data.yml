# This file is used to start the PostgreSQL service locally
# It is used to test/develop the services locally
# It is not used to deploy the services to the cloud
# It is not used to deploy the services to the cloud

services:
  publyapp-postgres:
    # ref: https://hub.docker.com/_/postgres
    image: postgres:18-alpine # 17.0
    container_name: publyapp-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: publyapp_db
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 5454:5454
    networks:
      - publyapp-network

volumes:
  postgres-volume:
    external: false

networks:
  publyapp-network:
    external: false
